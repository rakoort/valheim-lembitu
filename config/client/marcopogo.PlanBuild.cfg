# Pack seed: PlanBuild client keys (2026-10-05, AuditUX proposal). Plan mode leaves Q (vanilla
# use/category and Extra Snaps) for Equals, mirror leaves H (Oathbound's class window, AzuHoverStats)
# for Minus, and the blueprint marketplace window leaves its own key for Insert; the Alt modifier
# moves to RightAlt so planning never trips Extra Snap's LeftAlt. Shift and Ctrl stay contextual
# tool modifiers.

[Keybindings]
Blueprint Marketplace GUI toggle key = Insert
Mirror = Minus
Toggle = Equals
AltModifier = RightAlt
