# Client-side EpicMMOSystem HUD seed, shipped in the Pack (#70).
#
# Every key in this file is "Not Synced with Server", so it is a Pack seed and not enforced config.
#
# The mod replaces the vanilla HUD with one grouped bar carrying XP, health, stamina and eitr. The
# XP bar is worth having — character level is one of the run's two power curves — but the rest is
# a worse version of a HUD players already read without thinking. Each of these three keys
# documents `none` as "make vanilla", so setting them hands health, stamina and eitr back to the
# game's own bars.
#
# The exp fill colour is deliberately left at its generated value: `none` there does not mean
# vanilla, it removes the XP bar, which is the one part being kept.

[4.Hud--------------------]
3.1StaminaColor = none
4.1HPColor = none
5.1EitrColor = none
