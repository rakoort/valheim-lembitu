# Pack seed: DamageMeter keys (2026-10-05). F6 opens the menu; End toggles the live panel,
# Backslash cycles its mode and Pause starts/stops an expedition. PlanBuild now uses Insert,
# freeing End. F2 belongs to vanilla, F3/F4 to Extra Snaps, F8 to DetailedLevels and F9 to Guilds.
# PageUp/PageDown are vanilla chat scroll; F10 also belongs to SaunaMod's optional editor.
# DamageMeter reads MainKey only, so modifier chords cannot separate its actions.

[Live panel]
Expedition key = Pause
Mode key = Backslash
Toggle key = End

[Menu]
Menu key = F6
