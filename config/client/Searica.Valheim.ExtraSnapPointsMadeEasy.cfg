# Pack seed: Extra Snap Points Made Easy client keys (2026-10-05, AuditUX proposal). The iterate
# keys move off Q and E - vanilla's use and category-tab keys, and PlanBuild's mode key - onto the
# free bracket pair. 2.2.0 shifted the mode keys and put grid precision on Q, so the seed holds the
# keys players already know: LeftAlt, CapsLock, F3 and F4, the pre-2.2.0 defaults (2026-10-17).

[Manual Snapping]
Toggle Manual+ Snap Mode = LeftAlt
Toggle Manual Snap Mode = CapsLock
Toggle Grid Snap Mode = F3
Cycle Grid Snap Precision = F4
Iterate Placing Piece Snap Points = LeftBracket
Iterate Targeted Piece Points = RightBracket
