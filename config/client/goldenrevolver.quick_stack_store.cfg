# Pack seed: Quick Stack's modifier-aware container shortcuts share the otherwise unused U key.
# Ctrl+U quick stacks, Shift+U restocks, LeftAlt+U sorts and RightAlt+U trashes a held item.
# This avoids SocialSystem's P, Oathbound's L, CraftyBoxes' Alt+O and HoverStats' Delete.
# These are local preferences; the server separately pins both nearby ranges at zero.

[2.1 - Quick Stacking]
QuickStackKeybind = U + LeftControl

[2.2 - Quick Restocking]
RestockKeybind = U + LeftShift

[4 - Sorting]
SortKeybind = U + LeftAlt

[5 - Trashing]
TrashKeybind = U + RightAlt
