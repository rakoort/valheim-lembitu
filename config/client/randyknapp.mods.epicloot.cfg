# Client-side EpicLoot seed, shipped in the Pack (#70).
#
# These keys are marked "Not Synced with Server", so the server cannot hold them: each player's own
# file decides. That is why they are a Pack seed rather than enforced config — the one thing the
# AdminQoL lesson says to be explicit about. A player who edits them afterwards has changed their
# own display and nothing else; nothing here touches what drops or how strong it is.
#
# The palette. Stock is six saturated hues plus neon cyan for set items, which the first tester
# described as a bag of Skittles against Valheim's rustic look. These six are the muted
# replacements decided on 2026-09-16, and they read as materials rather than as a rainbow:
# weathered iron, bronze, moss, tanned leather, ember, bruised slate.
#
# Generated names off. Stock invents a name for every magic item, so a level-1 kill drops
# "Gleaming Club of the Bear". The item's own name plus its rarity colour says everything the
# player needs, and the vanilla item names stay readable.

[1 - General]
Use Generated Magic Item Names = false

[7 - Item Colors]
Magic Rarity Color = #8a9ba8
Rare Rarity Color = #b08d57
Epic Rarity Color = #6b7f5e
Legendary Rarity Color = #9c6b4f
Mythic Rarity Color = #8c4a3c
Ancient Rarity Color = #5d4a5c
Set Item Color = #7d8a6f
