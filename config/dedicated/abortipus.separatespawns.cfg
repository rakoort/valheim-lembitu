# Enforced config for SeparateSpawns (#86) — and the one file in this repository that the ordinary
# overlay cannot own.
#
# SeparateSpawns 0.1.0 does not use BepInEx's config directory on a dedicated server.
# `ModPaths.UseDedicatedConfigLayout()` returns true for any headless server, and
# `GetDedicatedConfigRoot()` then returns `<game root>/config/bepinex` — inside the container's
# game tree rather than `/config`. Two things follow. `scripts/apply-enforced-config.sh` cannot
# reach it, so a file in `config/enforced/` would be applied to a path the mod never reads while
# the drift check reported success: exactly the silence ADR-0011 exists to prevent. And that
# location is wiped when the container re-extracts BepInEx, which happened on 2026-09-17.
#
# `scripts/apply-dedicated-config.sh` therefore applies this file, and the deploy re-applies it
# every time. See docs/wiki/operations.md.
#
# `InnerRadius` is the maximum distance from world centre the spawn search considers. It went 3000
# -> 2400 when two groups woke 2.3-3.0 km out, then 3200 for five groups, and 2400 again from
# 2026-10-03 for three collaborative start groups. On 2026-10-04 the owner halved it to 1200, with
# `MinStonesDistance` 1000 -> 500, so starts lie 0.5-1.2 km from the sacrificial stones: reaching
# the Oathstone is a short first trip rather than a journey. Three spawns 1 km apart still fit.
#
# `MinSpawnDistance` 1000 against the package's 500: the three starts stay distinct places.
#
# Players are never curated (owner, 2026-10-03). The roster seed names three empty groups; the mod
# assigns each new player to a random group on first join and writes that back, and clans are
# formed freely in the Clan mod, independent of spawn group.
#
# The scoring and requirement changes answer the first two worlds, where starts read as either
# loaded or lethal. The mod requires Black Forest and burial chambers near every candidate and scores
# only islands, separation and meadows size — nothing penalises a swamp or a mountain next door. So:
# `MinBurialChambers` 1 instead of 3 and `BlackForestProximity` 800 instead of 400 stop forcing
# crypt-dense seams; `EikthyrReach` 800 instead of 200 keeps the first boss findable but out of camp;
# `MeadowsSizeWeight` 20 and `IslandsWeight` 6 make a large safe meadows patch outrank island novelty,
# which three spawns inside 2400 m rarely earn anyway; and `MinPatchArea` 25000 stops a sliver of
# meadows counting as a patch.
#
# `MinStonesDistance` 500 (from 1000, see above): groups still wake out of sight of the sacrificial
# stones, which is where the shared portal hub sits.
#
# Not pinned yet, and worth deciding: the scoring weights. The mod scores only islands (16),
# separation (10) and meadows size (9), and *requires* Black Forest within 400 m with three burial
# chambers plus an Eikthyr altar within 200 m. That combination is why starts read as either loaded
# or lethal — copper, crypts and a boss on the doorstep, with no penalty for a swamp or mountain
# next door. The proposal on the table is MinBurialChambers 1, BlackForestProximity 800,
# EikthyrReach 800, MeadowsSizeWeight 20, IslandsWeight 8 and MinPatchArea 25000.

[Placement]
InnerRadius = 1200
MinStonesDistance = 500
MinSpawnDistance = 1000
MinPatchArea = 25000
BlackForestProximity = 800
MinBurialChambers = 1
EikthyrReach = 800

[Scoring]
IslandsWeight = 6
MeadowsSizeWeight = 20
