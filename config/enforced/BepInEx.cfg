# Enforced loader config for BepInEx itself (#68).
#
# One key, and it is an evidence decision rather than a gameplay one. BepInEx truncates
# LogOutput.log on every start by default, so a restart destroys the log of the boot that
# preceded it - which is exactly the log anyone investigating a restart wants to read. Appending
# keeps the chain.
#
# The cost is a file that grows for as long as the run lasts, which is accepted: the run is three
# months and the log is a few megabytes an evening. Anyone reading the file for a specific boot
# looks for the last `Chainloader startup complete` rather than assuming the file starts at one.

[Logging.Disk]
AppendLog = true
WriteUnityLog = true

# Live's values (read 2026-10-27), kept for the Pool: the Workload copies this file whole, so a key
# left out returns to its default (docs/server-image.md, "The config"). The live server logs
# BepInEx's lines to the console, so they reach the container log beside the game's, and writes
# Unity's own lines into LogOutput.log.
[Logging.Console]
Enabled = true
ForceBepInExTTYDriver = true
PreventClose = true
