# Enforced server config for Lembitu.Guilds (2026-10-05, ADR-0028). Plugin defaults, pinned because
# the design depends on them.
#
#   [Bridge] Enabled = true        - guilds claim SeparateSpawns' start regions and regions follow
#                                    guild membership. Off hands every player back to SeparateSpawns'
#                                    random assignment; claims stay recorded but unenforced.
#   [Bridge] ReconcileSeconds = 2  - how often the server re-derives SeparateSpawns' roster from
#                                    Guilds' membership, so joins, leaves, kicks and disbands apply
#                                    without either mod patching the other.

[Bridge]
Enabled = true
ReconcileSeconds = 2
