# Enforced server config for BlacksmithingExpanded (2026-10-04, ADR-0024). The smith is the guild's
# armourer (ADR-0023); a master smith's gear is modestly better, so who made it matters on the Market,
# without stacking a second large combat curve on EpicLoot and Oathbound.
#
#   Stat tier interval = 10                - one bonus tier per 10 Blacksmithing levels (package: 5).
# Mastery (2026-10-06, owner): +20% damage, +10 armour and +20 block at 100;
# parry stays +1% per tier.
#   Stat percentage bonus per upgrade = 0  - no extra damage or armour per upgrade level, which the
#   Block power / Timed block per upgrade = 0  package gives to every crafter regardless of skill.
#   Elemental bonuses off                  - added elemental damage is EpicLoot's job.
#
# Bonuses are stamped on an item when it is crafted and reapplied on load even if these switches
# change later (BlacksmithingExpanded.cs:3758-3805), so they must be in force before anything is
# crafted. Durability, smelting and kiln speed, ore saving and the extra-item chance stay as shipped:
# they are the smith's felt growth, already in the middle of the professions (ADR-0024).
#
#   The bundled skill manager's own death loss (package: 5%) is deliberately not pinned here. It
#   files the setting under a section named after an unresolved localization key
#   (`[skill_1208107160]`), so an overlay aimed at `[Blacksmithing]` was a silent no-op: a native
#   death on 2026-10-04 drained 20 -> 19 by the package and then 19 -> 18.05. Lembitu.Callings now
#   puts the skill back after the package's loss and drains a non-focus Blacksmithing once, by World
#   Advancement Progression's floor; a focus keeps its XP (ADR-0022).
#
# XP stays about 1.75x the package (2026-10-06, owner, ADR-0030), with the
# ImpactfulSkills 3.8x rate on top for mastery at Kall. Repairs stay 0.1.

[Stats]
Enable damage bonus = true
Enable armor bonus = true
Stat tier interval = 10
# Mastery armour per ten levels (2026-10-06, owner).
Armor bonus per tier = 1
Boost elemental weapons = false

[PercentageSystem]
Use percentage damage bonus = true
# Mastery damage percent per ten levels (2026-10-06, owner).
Damage percentage bonus per tier = 2
Use percentage upgrade bonus = true
Stat percentage bonus per upgrade = 0

[Elemental]
Enable elemental bonus = false
Add elemental at milestone = false

[Shields]
Enable shield bonus = true
# Mastery block per ten levels (2026-10-06, owner).
Block power bonus per tier = 2
Block power bonus per upgrade = 0
Timed block bonus per tier = 0.01
Timed block bonus per upgrade = 0

[XP]
XP per craft = 1.75
XP per smelt = 1.3125
XP per upgrade = 5.25
First craft bonus XP = 17.5
