# Enforced server config for ZenRaids (2026-10-04, ADR-0019). Raids run at vanilla odds in every
# biome early in the Run; base safety is earned later through the Guilds monster ward.
#
#   Raid Chance Bonus By Player = 0, Min Player Count = 1
#                         - raid odds do not rise with how many players are online: combat
#                           difficulty never scales with headcount (ADR-0019). Both are the package
#                           defaults, pinned because the concept depends on them.
#   Raid Chance = -1      - vanilla odds (20%).
#   No Raid Biomes = None - the package excludes the Meadows by default, which would make early
#                           bases safe for free; vanilla raids reach every biome.
#
# Every raid is now an Oathbound siege (ADR-0020): when a raid would start, a siege starts at a
# ready outpost instead, scaled by the outpost's biome, so ZenRaids only decides when a raid would
# roll. Frequency is lowered by the launch modifier `Raids less`.

[Raids General]
Min Player Count = 1
Raid Chance = -1
Raid Chance Bonus By Player = 0
No Raid Biomes = None
