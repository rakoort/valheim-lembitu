# Public combined web map; server-only. Publish container port only on host loopback.
[Web]
Host = *
Port = 3000

[Map]
WorldRadius = 13250
WorldEdgeSize = 500
# A fallback only: with Expand_World_Size the fork computes this. BepInEx writes a float with seven
# significant digits, so the pinned value must be the serialized form or verify reports drift.
SharedMapHalfSize = 16091.43
Resolution = 4096
RenderThreads = 2
MaxZoom = 7

[Exploration]
ExploreRadius = 100
RevealGeneratedZones = true
RevealGeneratedZonesMargin = 1
RevealFromCartographyTable = true

[CartographyTables]
ScanInterval = 30

[Players]
# Owner 2026-10-09: everyone's live position, guild and exploration are public on the web.
IgnorePositionPrivacy = true
UpdateInterval = 1

[Storage]
# Empty resolves to Paths.ConfigPath/ValheimWebMap/<world>, on the persistent mount.
DataDirectory =
SaveInterval = 60

[History]
TrackSessions = true
TrackDeaths = true
RetentionDays = 0

[Display]
ShowHiddenPlayers = true
ShowBiome = true
ShowCoordinates = true
ShowHeading = true
ShowTimeOnline = true
ShowDeadStatus = true
ShowDeathCounts = true
ShowDayAndTime = true
ShowExploredPercent = true
ShowHistory = true
ShowSessionCount = true
ShowPlayTime = true
ShowLastSeen = true
RecentSessions = 30
ShowPins = true
ShowCheckedPins = true
ShowAutomatedPins = true
HidePinsInFog = true
PinMergeDistance = 10
ShowTraders = true
TraderLocations = Vendor_BlackForest=Haldor,Hildir_camp=Hildir,BogWitch_Camp=Bog Witch
ShowDeathMarkers = true
DeathMarkersPerPlayer = 5
