# Enforced server config for Lembitu.Callings (2026-10-04, ADR-0021, ADR-0022, ADR-0024). Plugin
# defaults, pinned because the design depends on them; the Shakedown tunes them.
#
#   [Steep curve]  A non-focus profession gains at full speed below 10, half below 60, a quarter
#                  below 80 and a tenth beyond (Band1End 30 until 2026-10-06, ADR-0030). A focus
#                  always gains at full speed, and its shadow level advances by this same curve.
#   [Calling] OathstoneRange = 10   - the Calling window (opened from the button in the skills
#                                     window) changes the Calling only within 10 m of the Oathstone;
#                                     it reads anywhere, and the skills-window stars are read-only
#                                     markers.
#   [Perks] HerbalistExtraAt100 = 2 - expected extra items per successful tonic, elixir or
#                                    mead-base craft at Herbalist 100, linear in level.
#   [Perks] FishingExtraAt100 = 2 - expected extra fish per landed catch at Fishing 100.
#   [Cook grade] A dish carries its maker's real Cooking grade: 1 below 25, +1 per 25, 5 at 100.
#                Each grade above 1 adds 5% to food stats (+20% at 5) and 12.5% shelf life (+50%).
#   [Brewer grade] Drinks carry the maker's real Herbalist grade through fermentation and the Market.
#                  Herbalist effect scaling reads (grade - 1) / 4 instead of the drinker's skill.
#   [Work meals]  While one of these dishes is eaten, its Land or Road profession counts as 10
#                 levels higher for perks; maker grades read the real level (ADR-0029).
#   [Log splitter], [Quick bite], [Steady overload]  The milestones Wood Cutting, Fishing and
#                 Hauling lacked, all at 50 (ADR-0030): a chop can split a whole fallen log into wood,
#                 10% rising to 50% at 100; fish head for the float every time they look for one
#                 (vanilla half the time); walking over the carry limit costs no stamina up to 1.5x it.
#   [XP log] ReportMinutes = 10  - each client reports its profession XP to the server log every 10
#                 minutes of play; the balance band of ADR-0030 is judged from these lines.
#
# Features without a key here: the Calling window itself, SeedBed beds following soil's biome rule
# (the level comes from ImpactfulSkills' FarmingBiomeUnrestrictedLevel, pinned 60 in
# config/enforced/MidnightsFX.ImpactfulSkills.cfg), Herbalist tonics and elixirs needing their
# biome's boss key, the BlacksmithingExpanded lock (ADR-0022) and a graded dish keeping its grade
# through a cooking station (ADR-0029). SeedBed's yields are pinned in
# config/enforced/blacks7ar.SeedBed.yml.

[Steep curve]
Band1End = 10
Band1Rate = 1
Band2End = 60
Band2Rate = 0.5
Band3End = 80
Band3Rate = 0.25
BeyondRate = 0.1

[Calling]
OathstoneRange = 10

[Perks]
# Mastery output ramp, 2026-10-06 owner.
HerbalistExtraAt100 = 2
# Mastery catch ramp, 2026-10-06 owner.
FishingExtraAt100 = 2

# Replaces Explorer Detection Radius before each tracker update; level 0 uses the
# level-1 range but tier unlocks still suppress its markers. Linear across 1..100.
[Explorer markers]
RangeAtLevel1 = 20
# Mastery live marker reach, 2026-10-06 owner.
RangeAt100 = 96

[Cook grade]
LevelsPerGrade = 25
# Master dishes reward the maker, +20% at grade 5, 2026-10-06 owner.
FoodBonusPerGrade = 0.05
ShelfLifePerGrade = 0.125

[Brewer grade]
# Maker-only potency; grade 5 at real Herbalist 100, 2026-10-06 owner.
LevelsPerGrade = 25
[Work meals]
LevelBonus = 10
Meals = BoarJerky:Explorer, DeerStew:WoodCutting, Sausages:Pickaxes, CarrotSoup:Farming, SerpentStew:midnightsfx.voyager, WolfJerky:midnightsfx.hauling, BloodPudding:midnightsfx.animalwhisper, FishWraps:Fishing

[Log splitter]
Level = 50
ChanceAtLevel = 0.1
# Master log-split chance, 2026-10-06 owner.
ChanceAt100 = 0.5

[Quick bite]
Level = 50
HookChance = 1

[Steady overload]
Level = 50
LoadLimit = 1.5

[XP log]
ReportMinutes = 10
