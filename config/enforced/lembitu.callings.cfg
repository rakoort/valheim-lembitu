# Enforced server config for Lembitu.Callings (2026-10-04, ADR-0021, ADR-0022, ADR-0024). Plugin
# defaults, pinned because the design depends on them; the Shakedown tunes them.
#
#   [Steep curve]  A non-focus profession gains at full speed below 30, half below 60, a quarter
#                  below 80 and a tenth beyond. A focus always gains at full speed, and its shadow
#                  level advances by this same curve.
#   [Calling] OathstoneRange = 10   - the star in the skills window changes the Calling only within
#                                     10 m of the Oathstone.
#   [Perks] HerbalistExtraAt100 = 1.5  - expected extra items per successful tonic, elixir or
#                                        mead-base craft at Herbalist 100, linear in level.
#   [Perks] FishingExtraAt100 = 1.25   - expected extra fish per landed catch at Fishing 100.

[Steep curve]
Band1End = 30
Band1Rate = 1
Band2End = 60
Band2Rate = 0.5
Band3End = 80
Band3Rate = 0.25
BeyondRate = 0.1

[Calling]
OathstoneRange = 10

[Perks]
HerbalistExtraAt100 = 1.5
FishingExtraAt100 = 1.25
