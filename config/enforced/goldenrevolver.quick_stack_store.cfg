# Enforced server config for Quick Stack - Store - Sort - Trash - Restock (2026-10-05). The mod's
# per-player preferences (buttons, hotkeys, sorting rules, trash) stay in each player's file; this
# overlay holds the area-stacking decision, which the mod marks as server-synced
# (`Config.BindSynced` / `BindSyncLocker` on the `goldenrevolver.quick_stack_store` ConfigSync,
# QuickStackStore.dll 1.4.16).
#
# `ToggleAreaStackRestockConfigServerSync = true` is the mod's own switch for "the host's area
# settings apply to every player using the mod", so it is what makes the two ranges below bind.
#
# Quick stack reaches every chest within 10 m (owner, 2026-10-11): the inventory's quick stack
# button, and Ctrl+U, put each stackable item into a nearby chest that already holds it. 10 m is
# the package default; it is pinned because it is a decision. The mod only touches chests players
# built that the player could open themselves: another player's private chest and a chest inside a
# ward that does not admit the player are skipped, and so are dungeon chests.
#
# MultiUserChest (docs/modstack.md) is what makes area stacking safe. With it, each item travels as
# a request to whichever game manages the chest, which accepts or refuses it. Without it, the mod
# claims each chest and edits it locally, which "can fail because no actual network requests are
# getting sent" (the mod's own description). `AllowAreaStackingInMultiplayerWithoutMUC = false` is
# the package default, kept on purpose: if MultiUserChest were ever missing, area stacking switches
# off instead of falling back to that.
#
# Restock still reaches only the open container (`RestockFromNearbyRange = 0`); only quick stack
# was asked for.

[2 - Quick Stacking and Restocking]
AllowAreaStackingInMultiplayerWithoutMUC = false
ToggleAreaStackRestockConfigServerSync = true

[2.1 - Quick Stacking]
QuickStackToNearbyRange = 10

[2.2 - Quick Restocking]
RestockFromNearbyRange = 0
