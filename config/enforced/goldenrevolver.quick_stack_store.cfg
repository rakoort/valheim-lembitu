# Enforced server config for Quick Stack - Store - Sort - Trash - Restock (2026-10-05). The mod's
# per-player preferences (buttons, hotkeys, sorting rules, trash) stay in each player's file; this
# overlay holds the area-stacking decision, which the mod marks as server-synced
# (`Config.BindSynced` / `BindSyncLocker` on the `goldenrevolver.quick_stack_store` ConfigSync,
# QuickStackStore.dll 1.4.15).
#
# `ToggleAreaStackRestockConfigServerSync = true` is the mod's own switch for "the host's area
# settings apply to every player using the mod", so it is what makes the two ranges below bind.
# `AllowAreaStackingInMultiplayerWithoutMUC = false` is the package default, kept on purpose: area
# stacking without MultiUserChest moves items without real network requests, and ship containers
# are its known weak spot. Both nearby ranges are 0, so quick stack and restock reach only the
# container that is open — the same one-container rule the run already chose for MultiUserChest
# (docs/modstack.md, "Considered and cut").

[2 - Quick Stacking and Restocking]
AllowAreaStackingInMultiplayerWithoutMUC = false
ToggleAreaStackRestockConfigServerSync = true

[2.1 - Quick Stacking]
QuickStackToNearbyRange = 0

[2.2 - Quick Restocking]
RestockFromNearbyRange = 0
