# Enforced server config for SkadiNet (#68): the network tuning profile that survived a full
# night with several players connected. It is pinned rather than left at defaults because a
# networking profile is only worth anything as the one that was measured - a package flip here
# changes how the server behaves under load, silently, and the symptom is a stuttering client
# rather than an error in a log.
#
# `DungeonLayerFiltering` is off deliberately. It is the one switch here that changes what a
# client is told about rather than how fast it is told, and this run ships Max Dungeon Rooms,
# whose dungeons are larger than anything the filter was measured against.

[General]
Enabled = true
SchedulerThroughput = 35
PayloadReducerStrength = 30
CompressionAggression = 50
OwnershipIntensity = 45
ClientStutterGuardStrength = 50
DungeonLayerFiltering = false
