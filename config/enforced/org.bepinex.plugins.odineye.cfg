# Enforced server config for OdinEye (2026-10-04, owner kept it for future tooling). Its REST API
# and WebSocket have no authentication, and POST /players/<id>/notify pushes messages into the game,
# so the server binds them to loopback only. Anything that needs them from outside goes through an
# authenticated tunnel or reverse proxy, never a published port. The value is the package default,
# pinned because exposing it would be a security decision.

[Hosting]
HttpServerAddress = http://localhost:2469/
