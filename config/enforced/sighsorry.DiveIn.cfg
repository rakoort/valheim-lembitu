# Enforced server config for DiveIn (#68): diving is a traversal rule, so it is the server's to
# decide rather than each player's.
#
# Every value below is what ran through the first evening of play and is pinned as-is. Underwater
# is dark and murky at half and a quarter of surface visibility, stamina does not regenerate at
# all below the surface, and eitr regenerates at 0.3 against 0.7 on top - so a dive is a held
# breath with a cost, not a second way to travel. The idle drain per depth and the swim drain
# multiplier are what make depth itself expensive.
#
# Swim speed, the fast-swim toggle and the underwater projectile penalties are left as the mod
# generated them; they are the mod's own feel and nothing in the review argued with them.

[1 - General]
Lock Configuration = On

[2 - Player Diving]
Darkness Factor = 0.5
Murkiness Factor = 0.25

[3 - Regen Rate]
Surface Stamina Regen Rate = 0.5
Midwater Stamina Regen Rate = 0
Surface Eitr Regen Rate = 0.7
Midwater Eitr Regen Rate = 0.3

[4 - Stamina Drain]
Midwater Idle Stamina Drain Per Depth = 0.02
Swim Stamina Drain Multiplier Per Depth = 2.5
