# Enforced server config for EpicLoot, rebuilt from 0.14.13 package defaults on 2026-10-04 (owner's
# decisions). Only settings that differ from the package, or that the run depends on, are pinned.
#
# `Item Drop Limits = PlayerMustKnowRecipe`: a magic item drops only for an item the player knows the
# recipe of, so magic gear follows each character's personal-key progress. The package default
# `BossKillUnlocksCurrentBiomeItems` reads world keys, which World Advancement Progression blocks on
# this server, so it would hold magic drops at Meadows tier.
#
# `Global Drop Rate Modifier = 0.6`: magic gear stays a treat. `Shard Stone Drop Ratio = 0.1`: half
# the package's 0.2, so sockets fill slowly.
#
# The enchant counts per rarity need no patch: 0.14.13's stock `MagicEffectsCount` already keeps each
# rarity at its minimum 92% of the time.
#
# Tempering is a gamble: a failed temper can destroy the item, with the package's 50% destroy roll.
#
# Adventure Mode stays on (package default): Haldor's treasure maps, bounties, gambling and secret
# stash are the run's only bounty and treasure system since Almanac left. `Gated Bounty Mode` stays
# `Unlimited`, because its boss-kill gates read world keys this server blocks. Each player may hold
# at most five bounties in progress.

[2 - Balance]
# `Gated Freebuild Mode = BossKillUnlocksCurrentBiomePieces` (owner, 2026-10-04). The FreeBuild
# effect on a Mythic or Ancient hammer or hoe lifts a piece's crafting-station requirement, and this
# mode lifts it only for stations whose boss has been killed as a world key. This server blocks
# world keys, so in practice FreeBuild skips the workbench and nothing past it; that limit is wanted.
Gated Freebuild Mode = BossKillUnlocksCurrentBiomePieces
Item Drop Limits = PlayerMustKnowRecipe
Global Drop Rate Modifier = 0.6
Shard Stone Drop Ratio = 0.1
# `Boss Trophy Drop Mode = Default` (owner, 2026-10-04): one boss trophy, one Wishbone and one swamp
# key per kill, whoever was there. The package's `OnePerPlayerNearBoss` multiplies all three by the
# players within 100 m (EpicLoot.dll, CharacterDrop.GenerateDropList postfix), which is player
# scaling on loot. Fixed loot means a boss group shares what drops, and killing a boss again has a
# reason: another Wishbone, another key, another trophy.
Boss Trophy Drop Mode = Default

[4 - Enchanting Table]
Temper Fail Destroys Item = true
Temper Destroy Chance = 0.5

[5 - Adventure]
Adventure Mode Enabled = true
Gated Bounty Mode = Unlimited
Enable Bounty Limit = true
Max Bounties Per Player = 5
