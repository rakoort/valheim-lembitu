# Enforced server config for EpicLoot (#66, #68, ADR-0010).
#
# This server writes no world keys (#11, ADR-0005), so every gating mode that reads world
# progression leaves the roster at Meadows tier forever. `PlayerMustKnowRecipe` reads the
# requesting player's own known recipes instead, so drop quality follows the character, and
# `Gated Freebuild Mode` follows it so building pieces obey the same rule.
#
# Caveat recorded in docs/modstack.md: the mode reads Player.m_localPlayer.IsRecipeKnown, and
# EpicLoot gates everything when there is no local player, so it only works where loot is rolled on
# a client. If the two-client session (#10) shows universal downgrades, the fallback is Unlimited.
#
# The curve, decided 2026-09-16 after an evening of play produced more magic gear than anyone could
# carry. `Global Drop Rate Modifier` is the single lever over every table, at 0.6 of stock; shard
# stones fall from 0.2 to 0.05 because they were the loudest part of the flood. `Item Drop Ratio`
# and `Set Item Drop Chance` keep their stock values and are pinned anyway, because they are the
# other two numbers that decide how much loot a kill produces.
#
# Boss trophies and the wishbone drop one per player standing within a hundred metres, which is the
# same rule personal keys use: presence at the kill is what earns the reward (ADR-0010). Stock
# already does this; it is pinned so a package flip cannot make a boss kill a race for one trophy.
#
# Adventure Mode is off: bounties, treasure maps, gambling and the secret stash all go with it.
# Enchanting materials then come only from sacrificing and disenchanting gear.
#
# Effect counts per rarity are not keys in this file at all - they live in the mod's own
# loottables.json and are delivered as a patch file (#73).

[2 - Balance]
Item Drop Limits = PlayerMustKnowRecipe
Gated Freebuild Mode = PlayerMustKnowRecipe
Global Drop Rate Modifier = 0.6
Item Drop Ratio = 0.7
Shard Stone Drop Ratio = 0.05
Set Item Drop Chance = 0.15
Boss Trophy Drop Mode = OnePerPlayerNearBoss
Boss Trophy Drop Player Range = 100
Wishbone Drop Mode = OnePerPlayerNearBoss
Wishbone Drop Player Range = 100

[5 - Adventure]
Adventure Mode Enabled = false
