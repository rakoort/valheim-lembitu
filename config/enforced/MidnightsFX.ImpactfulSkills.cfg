# Enforced server config for ImpactfulSkills (2026-10-04, ADR-0021). ImpactfulSkills supplies the
# Land and Road professions and Cooking. It adds nothing outside them:
#
#   Forging and Crafting off  - BlacksmithingExpanded owns smithing; both mods add crafting-station
#                               levels, bonus output and item-bound bonuses, and they would stack.
#                               Forging is ImpactfulSkills' second smithing skill, Crafting its
#                               bonus-item, durability and material-return perks.
#   Combat and Body perks off - Weapon skills, Blocking, Blood Magic, Sneak, Run, Jump and Swimming
#                               are Combat or Body skills (ADR-0021); combat power is Oathbound's.
#                               EnableWeaponSkill does not stop the equip-speed bonus on its own
#                               (EquipSpeedHelper.Apply has no enable check), so its factor is zero.
#   Knowledge Sharing off     - it makes a specialist level other skills faster, which works against
#                               focus professions.
#   Animal bonus star on      - a master breeder's tames and eggs can carry an extra star: Animal
#                               Handling's quality reward, kept by the owner although starred tames
#                               fight harder (2026-10-04).
#   Unlocks on the ladder     - every perk that switches on at a level sits on a rung of ADR-0023's
#                               ladder, 40, 50, 60 or 70, never below 30 where everyone levels at
#                               full speed (ADR-0024). The growth-timer readout stays at 12: it is
#                               information, not power.
#   ScaleCraftedEquipmentQuality off
#                             - a Crafting perk that EnableCrafting does not reach: high-quality
#                               ingredients would craft higher-star gear without upgrade costs,
#                               around the smith's ladder.
#   Felt growth, no obvious best pick (ADR-0024)
#                             - each profession's perks grow visibly with level, and the outliers are
#                               brought to the middle: chop and pickaxe damage x1.5 and wood and ore
#                               x1.67 at 100 (package x2.2, x3 and x2); taming, tamed slaughter yield
#                               and honey each x2.5 (package x7, x3, x2); carry weight +100 (package
#                               +50). Cooking and Farming keep their package magnitudes. Starting
#                               values; the Shakedown judges them by playing each focus.
#   Crew bonus on             - every other passenger adds sail force from their own Sailing skill.
#                               A reward for crewing a ship together, not difficulty scaling, so
#                               ADR-0019's no-headcount rule does not reach it (owner, 2026-10-04).
#   VoyagerIncreaseExplorationRadius = 0
#                             - Exploration owns map reveal, aboard as on foot: since 2026-10-05
#                               blacks7ar/Explorer scales the reveal by its skill, on BetterMap's base
#                               radius. A Sailing multiplier on top would make ships out-scout the
#                               Explorer, so zero keeps it off (ADR-0024).
#   Cooking for the cook (ADR-0029)
#                             - EnableCookingEatXP off: eating would level everyone's Cooking,
#                               rungs included, without cooking. EnableCookingDegradeReduction off:
#                               it slows food decay for an eater with Cooking skill, and FineDining's
#                               food update replaces the Player.UpdateFood body it rewrites, so it
#                               would do nothing anyway. Bonus servings at 40 stay the cook's.

[Forging]
EnableForging = false
EnableMasterwork = false
EnableLightweight = false
EnableRefinementBonus = false

[Crafting]
EnableCrafting = false
EnableBonusItemCrafting = false
EnableDurabilityLossPrevention = false
EnableDurabilitySaves = false
EnableMaterialReturns = false
ScaleCraftedEquipmentQuality = false

[Woodcutting]
WoodCuttingDmgMod = 0.5
WoodCuttingLootFactor = 1.67

[Mining]
RequiredLevelForMiningCrit = 40
MiningAOELevel = 50
RockBreakerRequiredLevel = 70
MiningDmgMod = 0.5
MiningLootFactor = 1.67

[Cooking]
RequiredLevelForBonusCookingItems = 40
EnableCookingEatXP = false
EnableCookingDegradeReduction = false

[Farming]
GatheringRangeRequiredLevel = 40
FarmingMultiplantRequiredLevel = 40
FarmingBiomeUnrestrictedLevel = 60
FarmingGrowthTimeDisplayLevel = 12

[Voyager]
VoyagerPaddleSpeedBonusLevel = 40
BoatDamageReductionLevel = 50
VoyagerReduceCuttingStart = 50
VoyagerImpactResistanceLevel = 70
EnableFriendsRowSpeedBonus = true
VoyagerIncreaseExplorationRadius = 0

[WeaponSkills]
EnableWeaponSkill = false
WeaponSkillEquipSpeedFactor = 0

[Blocking]
EnableBlocking = false
EnableParryStaminaGain = false

[BloodMagic]
EnableBloodMagic = false

[Sneak]
EnableSneakBonusDamage = false
EnableStealth = false

[Run]
EnableRun = false

[Jump]
EnableJump = false
EnableFallDamageReduction = false
EnableFallDamageHeightBonus = false

[Hauling]
HaulingMaxWeightBonus = 100

[AnimalHandling]
EnableAnimalBonusStar = true
BetterBeesLevel = 40
BeeBiomeUnrestrictedLevel = 50
AnimalBonusStarRequiredLevel = 70
AnimalTamingSpeedFactor = 1.5
TamedAnimalLootIncreaseFactor = 2.5
BeeHoneyOutputIncreaseBySkill = 1.5

[Swimming]
EnableSwimming = false
EnableSwimStaminaCostReduction = false

[SkillRates]
EnableKnowledgeSharing = false
