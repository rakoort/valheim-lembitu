# Enforced server config for GlassPieces (2026-10-03, owner's decision): silica pickups spawn,
# because glass pieces cannot be crafted without them. Pinned so a fresh install or upstream flip
# cannot silently remove the only silica source.
#
# `Use Smelter = Off` (2026-10-05) keeps silica ore smelting closed, its package default, pinned so
# an upstream flip cannot open an early glass path past the profession ladder.

[1- ServerSync]
Lock Configuration = On

[2- General]
Use Smelter = Off

[3- Silica-Pickable]
Enable Pickable = On
