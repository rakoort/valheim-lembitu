# Enforced server config for AdditiveDamageModifier (2026-10-04, owner's decision). Resistances add up
# instead of the strongest one winning, and a player always takes at least a quarter of every damage
# type the mod floors, so stacked armour, meads and EpicLoot resistance effects can never make a
# character immune, and frost, poison and fire stay dangerous in full gear (the package floor is 10).
# Spirit has no player floor in the mod. Tier percentages stay at the package values.

[1 - General]
Lock Configuration = On

[2 - Additive Damage]
Player Minimum Damage Taken Percent - Blunt = 25
Player Minimum Damage Taken Percent - Pierce = 25
Player Minimum Damage Taken Percent - Slash = 25
Player Minimum Damage Taken Percent - Fire = 25
Player Minimum Damage Taken Percent - Poison = 25
Player Minimum Damage Taken Percent - Frost = 25
Player Minimum Damage Taken Percent - Lightning = 25
