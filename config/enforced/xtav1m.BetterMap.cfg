# Enforced server config for BetterMap (2026-10-04, ADR-0019). The concept allows readouts but no
# radar: threats and resources are found by looking, not swept up from 100 m around corners.
#
#   Show Creatures = false   - the creature radar is the strongest information advantage in the
#                              mod, and it undoes ambushes the difficulty is tuned around.
#   Reveal Traders = false   - finding Haldor, Hildir and the bog witch is part of exploring.
#   Pin Radius = 15          - automatic pins only for what a player actually walks past; the
#                              package's 100 m spots deposits through hills and trees.
#   Exploration Radius = 100 - the vanilla value, pinned because it is a run decision: the map is
#                              personal, and ExpertExplorer's skill is what widens it.
#
# Every key above is synchronised by the mod's ServerSync, and `Lock Configuration` makes the
# server's values win.

[1 - ServerSync]
Lock Configuration = true

[Creatures]
Show Creatures = false

[Auto Pins]
Enable = true
Pin Radius = 15
Reveal Traders = false

[Map]
Exploration Radius = 100
