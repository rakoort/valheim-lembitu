# BetterMap is the map interface only (2026-10-05, ADR-0019). Explorer owns
# skill-gated live resource/dungeon markers; automatic BetterMap pins are off.
# Creature radar and trader reveal stay off. BetterMap alone writes the baseline
# m_exploreRadius = 100; Explorer scales the Explore argument, not that field.
# Boats, carts, death markers and zoom remain enabled at their package defaults.
# ServerSync locks these values.

[1 - ServerSync]
Lock Configuration = true

[Creatures]
Show Creatures = false

[Auto Pins]
Enable = false
Pin Radius = 15
Reveal Traders = false

[Map]
Exploration Radius = 100
