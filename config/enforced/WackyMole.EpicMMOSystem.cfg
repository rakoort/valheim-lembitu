# Enforced server config for EpicMMOSystem (#68). Character level is the run's first power curve
# (ADR-0004), so the whole XP economy is a run decision even where the value equals the package
# default - an upstream default is not a decision (CONTEXT.md, Enforced config).
#
# `Force Server Config` is the key that makes the rest of this file mean anything: without it each
# client's own file decides its levelling.
#
# The curve and the attribute economy are pinned exactly as they ran through the first evening.
# That is deliberate: the owner chose to measure real levelling rates on a real run before tuning
# them, and pinning them now is what makes a later change a measured change rather than a drift.
#
# Death costs a proportion of the level's experience, between 5% and 15%. The package ships a 25%
# ceiling; 15% is the decision, because a death in this run already costs a corpse run under
# PvPBiomeDominions' retention rules.
#
# The range keys are metres: at 100 a clan spread across a fight still shares the kill, and a
# player is still credited for a kill made at bow range. The package's 70 cut both short.
#
# Creature levels belong to CreatureManager, which owns the biome level preset and karma
# (`sighsorry.CreatureManager.cfg`). `Enabled_creature_level` is this mod's competing system and
# is off, so two mods never both decide what level a creature is. `Mentor` stays on: it lets a
# high-level player group with a new one without erasing the newcomer's share.
#
# `altLevelUpSound` picks which of the mod's two bundled level-up prefabs plays: `false` is
# `LevelUpVFX` (the 2.4s "Wings buff" clip) and `true` is `LevelUpVFX2` (a 7.9s fanfare the
# package itself describes as "Loud and Heart attack inducing"). False is the quiet one, and it
# is pinned rather than left at the default because the setting is synced, so this file is what
# stops a client flipping itself into the fanfare.
#
# There is no volume key. Both prefabs carry an AudioSource at volume 1.0 with no output mixer
# group (read from the `epicasset` bundle in `EpicMMOSystem.dll` 1.9.67), so the clip bypasses
# Valheim's SFX mixer and the game's own sound sliders do not attenuate it. Making it quieter
# than this setting allows needs code on the client, not configuration.

[0.General---------------]
Force Server Config = true

[1.LevelSystem-----------]
MaxLevel = 100
LevelExperience = 300
MultiplyNextLevelExperience = 1.05
RateExp = 1
FreePointForLevel = 5
StartFreePoint = 5
PriceResetPoints = 3
BonusLevelPoints = 5:5,10:5
LossExp = true
MinLossExp = 0.05
MaxLossExp = 0.15
GroupExp = 0.7
Group EXP Range = 100
Player EXP Range = 100
altLevelUpSound = false

[2.Creature level control]
Mentor = true
Enabled_creature_level = false
