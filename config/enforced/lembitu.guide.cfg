# Enforced server config for Lembitu.Guide (2026-10-05, ADR-0027, ADR-0028). Plugin defaults,
# pinned because the design depends on them.
#
#   [Window] AutoOpenOnFirstJoin = true - a character's first join opens the guide on First steps
#            (ADR-0027). The join itself, not the admin, decides whether a newcomer sees the rules.
#
# The window's HotKey is deliberately not pinned here: it is a client preference, and a server
# overlay cannot change a player's controls (AuditUX, "Proposed conflict-free keyboard seed set").
# F1 is verified free of the vanilla bindings and of every Pack mod's default (ZInput 1.0.16 and
# the staged plugins, 2026-10-05).
#
# The guide's text is not a config value: the admin edits config/enforced/lembitu.guide.md, which
# deploys beside this file and is sent to clients at join and on reload.

[Window]
AutoOpenOnFirstJoin = true
