# FineDining spoilage policy (2026-10-06, ADR-0029). The package default with five preserved foods
# added: jerky, sausages and the smoked dishes keep forever, beside the package's honey. They are the
# cook's provisions for trips and stores; fresh dishes give more and spoil. Replaced wholesale by
# scripts/apply-enforced-config.sh.
#
# Group lifetime schema: <hours>[, keep]
# Hours are valid from 0 through 720; 0 disables that group, including 0, keep.
# A number alone uses the group's fixed rotten replacement. keep preserves the
# original prefab and stack, with freshness staying at its minimum after expiry.
version: 1
lifetimes:
  farmingHarvest: 96
  cookingStationInput: 48
  cookingStationOutput: 72
  unfermentedFood: 72
  fermentedFood: 96
  feastMaterial: 96, keep
  feastResult: 72, keep
  fish: 48
  otherEdible: 48

# Exact prefab names excluded only from Chef's Choice selection (Chef's Choice is off).
chefChoiceBlacklist: []

# Compact override schema:
#   - <prefab>, <hours>[, <replacement prefab or keep>]
# A positive override force-includes that exact prefab. 0 or 0, keep disables it.
overrides:
  - Raspberry, 96, keep
  - Mushroom, 96, keep
  - Honey, 0
  - Blueberries, 96, keep
  - BoarJerky, 0
  - WolfJerky, 0
  - Sausages, 0
  - SmokedFish, 0
  - SmokedMooseMeat, 0
