# Enforced server config for Oathbound (2026-10-06, owner; ADR-0020, ADR-0022).
# Deliberate deviations and defaults the Run depends on.
#
#   SharedExperience = false   - each kill is attributed to the owner of the killing blow;
#                                Lembitu.Oathbound then shares it with that player's guild members within
#                                100 m. On, Oathbound would pay full XP to every contributor.
#   ExperienceMultiplier = 2   - double kill XP (#123, 2026-10-19; stock 1 until then): class levels
#                                were well below the 10-per-boss-key power cap, so XP, not keys,
#                                held classes back. Still no talent-point cap.
#   DeathLossFraction = 0      - a death costs no class XP (#123, 2026-10-19; stock 0.5 removed half
#                                the progress toward the next level). The corpse run and the skill
#                                drain remain the cost of dying.
#   AccessMode = MenuButton    - tree anywhere after first oath; our plugin keeps oath changes and
#                                respec at the Oathstone (2026-10-06, owner).
#   RestrictionsEnabled = true - classes keep their armour, weapon, shield and bow rules;
#                                Lembitu.Oathbound opens only the gathering tools.
#   [Sieges] Enabled = true    - Oathbound's sieges are the Run's raids: whenever vanilla would start
#                                a random raid, a siege starts at a ready outpost (a portal, or a
#                                crafting station with six or more pieces within 90 m) instead, scaled
#                                by the outpost's biome and never by headcount (2026-10-04).
#   [BloodMoon] Enabled = false - off (package: on). Its siege reads the world's boss keys, which
#                                World Advancement Progression blocks, so it stayed at tier 0 forever;
#                                and its sense and star multipliers are each player's local,
#                                unsynced setting, against the Pack rule (2026-10-04).

[Progression]
SharedExperience = false
ExperienceMultiplier = 2
DeathLossFraction = 0

[Classes]
AccessMode = MenuButton

[Equipment]
RestrictionsEnabled = true

[Sieges]
Enabled = true

[BloodMoon]
Enabled = false