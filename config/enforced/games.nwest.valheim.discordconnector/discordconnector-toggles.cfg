# Enforced notification toggles for DiscordConnector (#68, #17): which events reach the channel.
#
# The relay's job is to tell a group that plays at different hours what happened while they were
# away - the server came up or went down, who joined, who left, who died, and what anyone shouted.
# Those eight toggles are the decision; every value matches the package default and is pinned
# because the relay is only useful if its contents are fixed rather than whatever the next
# release enables.
#
# What is deliberately not pinned here: the world-save notice, the player-firsts messages, the
# stat collection and the leaderboards. Nothing in the review argued about them, and pinning a
# key nobody decided would make this file a copy of the mod's output rather than a list of
# choices (CONTEXT.md, Enforced config).
#
# Position toggles in [Toggles.Position] are moot: `Send Positions with Messages = false` in
# discordconnector.cfg gates all of them.

[Toggles.Messages]
Server Launch Notifications = true
Server Loaded Notifications = true
Server Stopping Notifications = true
Server Shutdown Notifications = true
Player Join Notifications = true
Player Leave Notifications = true
Player Death Notifications = true
Chat Shout Messages Notifications = true
