# Enforced server config for DiscordConnector (#68, #17): what the relay is allowed to say.
#
# The webhook URL is deliberately absent. It is a secret and belongs in
# config/launch/launch.secret.env, never in a committed overlay - and because it is absent here,
# the overlay never overwrites a URL the operator placed in the live file.
#
# Positions are off. The map already hides every player from every other player
# (`Turbero.PvPBiomeDominions.cfg`, [3 - Map Position]); a relay that posts coordinates to a chat
# channel would hand back exactly what that decision removed, to anyone in the channel.
#
# Mentions of @here and @everyone are refused, so a death notice cannot notify a whole server.
# Role and user mentions stay as the mod generated them: those require someone to type a name.

[Main Settings]
Send Positions with Messages = false
Allow @here and @everyone mentions = false
