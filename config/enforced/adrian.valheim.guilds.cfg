# Enforced server config for Guilds (2026-10-04, ADR-0019; amended 2026-10-05). The server's values
# are the ones Guilds uses for its Server, Integrations, Progression, Territory and Upgrades
# sections. Every key here was re-checked against Guilds.dll 1.2.3 on 2026-10-05.
#
#   MaxMembers = 5            - guilds are three to five players; the cap is five. At most three
#                               guilds exist, one per start region (ADR-0019); this mod cannot cap that.
#   CreateCost = 0            - founding a guild is free (owner, 2026-10-05). The package's 1,000
#                               coins assume a wallet a new character cannot have, and admins cannot
#                               gift coins either; a guild is founded in its first minutes instead.
#   RejoinCooldownHours = 0   - leaving or being kicked never locks a player out of joining or
#                               founding another guild (owner, 2026-10-05; the package's 12 real hours
#                               would stall guilds still forming during the Shakedown).
#   members = P1,L99 and MembersPerUpgrade = 1
#                             - the Members upgrade would raise the cap by five a level. Its first
#                               level needs guild level 99, above MaxLevel (30), so the server
#                               refuses every purchase (GuildServer.RPC_Upgrade, Guilds 1.2.3,
#                               `num2 < upgradeCost.Level`) and the cap stays MaxMembers +
#                               tier("members") x MembersPerUpgrade. MembersPerUpgrade is clamped
#                               to 1..100 on boot, so 1 is the lowest value the file keeps; it adds
#                               nothing while no guild can buy the upgrade.
#   SharedProgression = false - a boss key goes only to the players present at the kill; a guild
#                               never hands it to members who were not there.
#   LevelXpGrowth = 1.15      - guild levels arrive sooner than the package's 1.25x curve (owner,
#                               2026-10-05), so the comfort and monster ward upgrades are reachable
#                               by an active guild inside a season. Base 1000 and MaxLevel 30 stay
#                               the package's.
#   comfort                   - SaunaMod and this upgrade both add comfort, and they stack. The owner
#                               kept both and made this one late and expensive: Mountain materials
#                               at guild level 12, Plains materials at level 20, against the package's
#                               Meadows-tier first level with no level requirement.
#   monsterward               - the earned base safety: no natural or raid spawns inside the claim.
#                               Mid-game by the owner's choice, guild level 10 with Swamp-tier iron
#                               and trophies, against the package's level 3 and bronze. Early bases
#                               are defended by hand.
#   DonationCoinsPerXp = 10   - trade feeds the guild: Market earnings can buy guild XP (owner,
#                               2026-10-05, the package's own rate; the reviewed 50 made donations
#                               a bad use of coins). Donated coins are destroyed, so this moves
#                               coins out of the economy and into guild growth.

[2 - Server]
CreateCost = 0
MaxMembers = 5
RejoinCooldownHours = 0

[3 - Integrations]
SharedProgression = false

[4 - Progression]
DonationCoinsPerXp = 10
LevelXpGrowth = 1.15

[5 - Territory]
MembersPerUpgrade = 1

[6 - Upgrades]
members = P1,L99
comfort = Silver:20,WolfPelt:20,C3000,L12;BlackMetal:30,LoxPelt:20,C8000,L20
monsterward = Iron:40,TrophyDraugr:5,TrophyBlob:5,C3000,L10
