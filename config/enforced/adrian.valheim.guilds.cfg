# Enforced server config for Guilds (2026-10-04, ADR-0019). The server's values are the ones Guilds
# uses for its Server, Integrations, Progression, Territory and Upgrades sections.
#
#   MaxMembers = 5            - guilds are three to five players; the cap is five, with no limit on
#                               how many guilds exist.
#   members = P1,L99 and MembersPerUpgrade = 1
#                             - the Members upgrade would raise the cap by five a level. Its first
#                               level needs guild level 99, above MaxLevel (30), so the server
#                               refuses every purchase (GuildServer upgrade handler, Guilds 1.2.2)
#                               and the cap stays MaxMembers. MembersPerUpgrade is clamped to 1..100
#                               on boot, so 1 is the lowest value the file keeps; it adds nothing
#                               while no guild can buy the upgrade.
#   SharedProgression = false - a boss key goes only to the players present at the kill; a guild
#                               never hands it to members who were not there.
#   comfort                   - SaunaMod and this upgrade both add comfort, and they stack. The owner
#                               kept both and made this one late and expensive: Mountain materials
#                               at guild level 12, Plains materials at level 20, against the package's
#                               Meadows-tier first level with no level requirement.
#   monsterward               - the earned base safety: no natural or raid spawns inside the claim.
#                               Mid-game by the owner's choice, guild level 10 with Swamp-tier iron
#                               and trophies, against the package's level 3 and bronze. Early bases
#                               are defended by hand.
#   DonationCoinsPerXp = 50   - trade feeds the guild: Market earnings can buy guild XP, at five times
#                               the package's price, so selling profession goods is one real path
#                               to guild growth beside activity, boss kills and achievements.

[2 - Server]
MaxMembers = 5

[3 - Integrations]
SharedProgression = false

[4 - Progression]
DonationCoinsPerXp = 50

[5 - Territory]
MembersPerUpgrade = 1

[6 - Upgrades]
members = P1,L99
comfort = Silver:20,WolfPelt:20,C3000,L12;BlackMetal:30,LoxPelt:20,C8000,L20
monsterward = Iron:40,TrophyDraugr:5,TrophyBlob:5,C3000,L10
