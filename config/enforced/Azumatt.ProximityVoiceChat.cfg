# Enforced server config for ProximityVoiceChat (#78): positional voice chat, quieter with
# distance. What each choice means is in docs/modstack.md; this file is the choices themselves.
#
# Only the keys the run has a reason to hold are here, and they are exactly the mod's
# `[Synced with Server]` ones: how far a voice carries, and what the codec costs the connection.
# Everyone hears the same distances, which matters once #67 makes a PvP stance a standing choice -
# being overheard is part of the risk, and it cannot be part of it if each player picks their own
# range.
#
# Nothing that belongs to a player is pinned, and the mod agrees with that split: microphone
# choice, gain, voice activation, push-to-talk, volume, mute, deafen, occlusion, jitter buffers,
# indicators and every keybind are all "Not Synced with Server" and stay the player's own. A
# server has no business deciding which microphone someone owns.
#
# The mod is not mandatory for a client. `ConfigSync("Azumatt.ProximityVoiceChat")` leaves
# `ModRequired` false and the assembly carries no hand-rolled version check, so a friend without
# the mod joins and plays with no voice rather than being refused. That is deliberate: voice is a
# convenience, not a rule.
#
# The values are the mod's own defaults, pinned because they are decisions rather than deviations
# (CONTEXT.md). 45 m carries across a base but not across a valley; 4 m is full volume, which is
# conversational distance; the 8 m buffer is what stops a voice cutting in and out at the edge.
# 24 kbit/s Opus with 5% expected loss is the bandwidth the server is willing to spend per speaker,
# and DTX stays off because it clips the first quiet word of a sentence.

[1 - General]
Lock Configuration = On

[2 - Proximity]
Max Range = 45
Range Buffer = 8
Full Volume Range = 4

[4 - Codec]
Bitrate = 24000
Expected Packet Loss = 5
Use DTX = Off
