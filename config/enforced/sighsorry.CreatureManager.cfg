# Enforced server config for CreatureManager (#25, #13, #84): cloning and customisation stay off.
# The four data files beside this overlay (creatures/attacks/ai/projectile yml) pin the
# verified-empty state, so a future package default that ships content is caught instead of
# silently loaded.
#
# What the mod is here for narrowed twice. It was adopted for Karma; on 2026-09-17 the owner
# switched Karma and every modifier off, so what remains is the part nothing else in the pack can
# do: fixed creature and boss multipliers, and holding vanilla's headcount scaling at zero. The
# alternative that was tried and rejected the same day is CreatureLevelAndLootControl 4.6.4, which
# cannot run on this game at all - five stale `ZRoutedRpc::Everybody` references, the ADR-0002
# failure mode, confirmed by `scripts/screen-bundled-libs.sh` and by a live
# `TypeInitializationException`.

[1 - General]
Lock Configuration = On

# Boss tier scaling (#13, ADR-0010). The built-in biome preset assigns a creature its level by biome
# and `bosses follow` is what lets a regular boss use it: levels.yml leaves `Boss.level` omitted, so
# without that toggle a boss falls back to level 1 everywhere. Boss health then follows
# `Boss.healthPerLevel` in levels.yml, so a later boss arrives at a higher level and a higher health
# pool without touching boss damage.
#
# `Hard`, chosen deliberately (#13). It is not the package default, which is why it is pinned: an
# upstream flip, or a fresh install, must not silently rebalance the run.
#
# The preset is not boss-only, and the choice is really about ordinary creatures. It sets the level
# distribution for every natural spawn in a biome, and `Global` is only the fallback where no biome
# rule applies. Expected level by biome, and therefore per-creature health and damage:
#
#   Meadows 1.10   BlackForest 1.39   Swamp 1.74   Mountain 2.04
#   Plains 2.33    Mistlands 2.62     AshLands 3.22
#
# That is roughly 40% stronger ordinary creatures than `Easy` (Meadows 1.00, AshLands 2.47). The
# earlier biomes are the point of the choice: Meadows and Black Forest still spawn at level 1 most of
# the time, so a new character is not softlocked, while every later biome lands harder.
#
# Bosses are the smaller part. Expected boss health multiplier under `Hard`, against `Easy`:
#
#   Eikthyr 1.05 (x1.00)   Elder 1.20 (x1.07)   Bonemass 1.37 (x1.18)   Moder 1.52 (x1.31)
#   Yagluth 1.67 (x1.44)   Queen 1.81 (x1.58)   Fader 2.11 (x1.74)
#
# The Eikthyr-to-Fader gradient moves from 1.74x to 2.01x, so later bosses do arrive meaningfully
# larger. It is a weighting, not a hard tier step: a boss rolls its level, so any single kill can
# land above or below its expected value. Observed boss health in a real fight, and any further
# retune, belong to #13 and #10's two-client session.
[2 - Levels]
Biome Level Preset = Hard
Bosses Follow Biome Level Preset = On

# Modifiers are off entirely, all three switches, from 2026-09-17. They generate into
# [2 - Levels] rather than the [5 - Modifiers] section their name suggests; the section here is
# the one the mod writes.
#
# Why they are off rather than tuned. The rates live per-target in `CreatureManager/levels.yml`
# and `karma.yml`, and the stock 5 per modifier reads as "5% of creatures" but is rolled once per
# group of eight, four groups — so nearly every ordinary creature carried one or two. Twelve
# players on 2026-09-16 found ordinary mobs unkillable. The rate was cut to 0.25 and then 0.125,
# 4 creatures in 100, before the owner decided the whole idea was not worth the surprise. The
# chance tables in `levels.yml` are now inert: the master switch decides, and a future release
# cannot reintroduce modifiers by changing a table.
Global Modifiers = Off
Boss Modifiers = Off
Enforcer Modifiers = Off

# Karma is off, and with it the Enforcer. Karma was regional pressure that rose as players killed
# in an area and eventually summoned a named creature; `CONTEXT.md` called that the run's stand-in
# for a scheduled event. The owner switched it off on 2026-09-17, so nothing stands in for an
# event today and `karma.yml` is inert.
#
# `Off` is the mod's own word for this: it "disables Karma runtime processing without deleting
# stored values", so the karma a zone has already banked stays on disk and turning the system back
# on restores it. The per-sector cap and the three blocking switches are gone from this file with
# it — pinning a value that nothing reads is enforcement nobody checks.
[3 - Karma]
Karma System Mode = Off

# Headcount scaling is off entirely. Vanilla makes every creature tougher for each player
# standing nearby - 30% effective health and 4% damage each, up to five - so the same boss is a
# different fight depending on who logged in, and inviting a sixth player made it easier. This
# run fixes difficulty instead and sets it in the level table: ordinary creatures at twice
# vanilla health, bosses at eight (`CreatureManager/levels.yml`). A fight is then the same fight
# whoever turns up, and bringing people is a choice about how fast it goes rather than a penalty.
#
# The player-count cap is pinned at 1 as well. With both percentages at zero it decides nothing,
# but leaving it at five would leave a live lever that re-enables the whole system the moment
# either percentage moved.
[4 - Multiplayer Difficulty]
HP Increase Per Player In Multiplayer (%) = 0
DMG Increase Per Player In Multiplayer (%) = 0
Maximum Player Count For Multiplayer Scaling = 1
