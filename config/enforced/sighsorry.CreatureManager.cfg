# Enforced server config for CreatureManager (#25, #13): cloning and customisation stay off. The four
# data files beside this overlay (creatures/attacks/ai/projectile yml) pin the verified-empty state,
# so a future package default that ships content is caught instead of silently loaded. Karma stays at
# the mod's defaults - Karma is the reason this mod is in the stack - and boss level is pinned below.

[1 - General]
Lock Configuration = On

# Boss tier scaling (#13, ADR-0010). The built-in biome preset gives a boss the biome's level
# distribution, and `bosses follow` is what lets a regular boss use it: levels.yml leaves
# `Boss.level` omitted, so without this the boss falls back to level 1 everywhere. Boss health then
# follows `Boss.healthPerLevel` in levels.yml, so a later boss arrives at a higher level and a
# higher health pool without touching boss damage.
#
# `Easy` is the package default and is pinned rather than chosen: an upstream default flip must not
# silently change boss balance. Retuning the tier happens against real fights, which are the whole
# point of #13; this overlay only fixes the mechanism.
[2 - Levels]
Biome Level Preset = Easy
Bosses Follow Biome Level Preset = On
