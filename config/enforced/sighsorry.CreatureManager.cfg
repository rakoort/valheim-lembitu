# Enforced server config for CreatureManager (#25, #13, #84): cloning and customisation stay off.
# The four data files beside this overlay (creatures/attacks/ai/projectile yml) pin the
# verified-empty state, so a future package default that ships content is caught instead of
# silently loaded.
#
# What the mod is here for narrowed twice. It was adopted for Karma; on 2026-09-17 the owner
# switched Karma and every modifier off, so what remains is the part nothing else in the pack can
# do: fixed creature and boss multipliers, and holding vanilla's headcount scaling at zero. The
# alternative that was tried and rejected the same day is CreatureLevelAndLootControl 4.6.4, which
# cannot run on this game at all - five stale `ZRoutedRpc::Everybody` references, the ADR-0002
# failure mode, confirmed by `scripts/screen-bundled-libs.sh` and by a live
# `TypeInitializationException`.

[1 - General]
Lock Configuration = On

# Fixed bosses for five players (2026-10-06, owner): Boss.level stays omitted
# in levels.yml and bosses do not follow the biome preset, so every boss is level 1.
# Boss.health = 5 and damage = 1.5; Combat hard remains unchanged.
# Hard stays for ordinary creatures, with gentler health growth of 0.75 per level.
# Expected ordinary levels: Meadows 1.10, BlackForest 1.39, Swamp 1.74, Mountain 2.04,
# Plains 2.33, Mistlands 2.62, AshLands/DeepNorth 3.22. Group size never changes them.
[2 - Levels]
Biome Level Preset = Hard
# Five-player fixed boss tuning (2026-10-06, owner).
Bosses Follow Biome Level Preset = Off

# Modifiers are back on for all three targets from 2026-10-04 (owner's decision). They generate into
# [2 - Levels] rather than the [5 - Modifiers] section their name suggests; the section here is
# the one the mod writes.
#
# `Max4` is the package's "on": no cap below the four groups, so the chance tables decide. Those
# live per target in `CreatureManager/levels.yml` (ordinary creatures, bosses) and `karma.yml`
# (Enforcers). The mod rolls once per group of eight, four groups, so a table entry is not a
# per-creature rate. Stock 5 per entry put a modifier on 76 in 100 ordinary creatures, which twelve
# players on 2026-09-16 found unkillable; modifiers were then off from 2026-09-17 until now.
# Targets (2026-10-06, owner): ordinary creatures ~20 in 100; bosses 1..4, mean ~2;
# Enforcers ~2 unchanged. Chance derivation and applicability are in levels.yml.
Global Modifiers = Max4
Boss Modifiers = Max4
Enforcer Modifiers = Max4

# Karma is on again from 2026-09-18, at the package's full mode. Karma is regional pressure that
# rises as players kill in an area; at a high enough level the region summons a named Enforcer.
# `CONTEXT.md` calls that the run's stand-in for a scheduled event, and switching it off on
# 2026-09-17 left nothing in that role.
#
# `KarmaLevelAndEnforcer` is both halves: Karma levels added to normal spawns in a pressured
# region, and Enforcer summons. The two narrower modes exist if that is too much - `KarmaLevelOnly`
# keeps the pressure and drops the summons, `EnforcerOnly` keeps the summons without levelling
# ordinary spawns.
#
# The cap and the four blocking switches are pinned again because they are read again. All five
# are at package defaults, and each one is a decision this run is making rather than inheriting:
# one Enforcer per 3x3 neighbourhood, no Enforcer while a real boss is up, no Karma banked while
# a boss or an Enforcer is alive, and Omen cannot bypass a region's Enforcer cooldown.
#
# `karma.yml` is pinned wholesale in `config/enforced/CreatureManager/` from 2026-10-04. It is the
# package's file except the Enforcer modifier chances, which give each Enforcer about two affixes.
[3 - Karma]
Karma System Mode = KarmaLevelAndEnforcer
Maximum Enforcers Per Sector = 1
Block Enforcer While Boss Is Active = On
Block Karma Gain While Boss Is Active = On
Block Karma Gain While Enforcer Is Active = On
Block Omen Enforcer During Cooldown = On

# Headcount scaling is off entirely. Vanilla makes every creature tougher for each player
# standing nearby - 30% effective health and 4% damage each, up to five - so the same boss is a
# different fight depending on who logged in, and inviting a sixth player made it easier. This
# run fixes difficulty instead and sets it in the level table: ordinary creatures at twice
# vanilla health, bosses at five (2026-10-06, owner; CreatureManager/levels.yml). A fight stays fixed
# whoever turns up, and bringing people is a choice about how fast it goes rather than a penalty.
#
# The player-count cap is pinned at 1 as well. With both percentages at zero it decides nothing,
# but leaving it at five would leave a live lever that re-enables the whole system the moment
# either percentage moved.
[4 - Multiplayer Difficulty]
HP Increase Per Player In Multiplayer (%) = 0
DMG Increase Per Player In Multiplayer (%) = 0
Maximum Player Count For Multiplayer Scaling = 1
