# ValheimRAFT 4.3.2 registers this entry with its locked ServerSync instance.
# Apply before creating any launch world; disable the whole cannon prefab family (#64, #26).
#
# Flight off (#68): a flying raft crosses every biome gate the run is built on, and the mod ships
# it on. The two debug switches are the same shape of problem - stock hands every non-admin the
# vehicle debug and edit commands - and experimental prefabs are unfinished content nobody chose.
[PrefabConfig]
CannonPrefabs_Enabled = false
AllowExperimentalPrefabs = false

[Propulsion]
AllowFlight = false

[Vehicle Debugging]
AllowDebugCommandsForNonAdmins = false

# No player builds a vehicle from 2026-09-17 (#82). The owner asked whether the mod could be
# disabled; this is the version that costs nothing to undo. `AdminsCanOnlyBuildRaft` registers
# every hammer-menu vehicle piece as disabled for a non-admin, and `UpdatePrefabStatus` applies it
# without either side restarting (`ValheimVehicles.dll` 4.3.2, lines 6217 and 50160). The key is
# `isSynchronized: true`, so the server holds it for everyone.
#
# The mod itself stays installed, and that is the whole point. ValheimRAFT is world-permanent
# (ADR-0009): its vessels are real prefabs in the world save, so removing the pin would delete
# every existing ship, whatever was stored on it, and leave anyone aboard in open water. Keeping
# the mod loaded while refusing new builds is reversible; removing it is not. Dropping the pin
# properly waits until the group confirms nothing is afloat, and rides with the next Pack.
[Server config]
AdminsCanOnlyBuildRaft = true
