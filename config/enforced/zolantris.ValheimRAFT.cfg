# ValheimRAFT 4.3.2 registers this entry with its locked ServerSync instance.
#
# This file has changed direction twice in one day, and the history is the point of the comments.
# Cannons were disabled from adoption (#64, #26), player building was closed on 2026-09-17 (#82),
# the pin was then removed outright (#85), and the owner restored the mod the same day **with
# cannons on** (#86). Anything that was afloat when the pin left is gone; the mod comes back to an
# empty sea.
#
# Cannons are on, which reverses the #64 decision knowingly. The cannon prefab family is combat
# content on a vehicle, so it lands where PvP does: a flagged crew can now shell another flagged
# crew, and an unflagged one cannot be shelled. That is the stance doing its job rather than a new
# rule, but it is the first weapon system this run has added.
#
# Player building is open again. `AdminsCanOnlyBuildRaft` was true from #82 to #86; at false every
# player can build vehicle pieces from the hammer menu, which is what "bring it back" means.
#
# Flight stays off (#68): a flying raft crosses every biome gate the run is built on, and the mod
# ships it on. Experimental prefabs stay off as unfinished content nobody chose, and non-admin
# debug commands stay off because stock hands every player the vehicle debug and edit commands.
[PrefabConfig]
CannonPrefabs_Enabled = true
AllowExperimentalPrefabs = false

[Propulsion]
AllowFlight = false

[Vehicle Debugging]
AllowDebugCommandsForNonAdmins = false

[Server config]
AdminsCanOnlyBuildRaft = false
