# Enforced server config for Herbalist. Benefits, not recipe blocks (2026-10-06 owner):
# anyone brews; Lembitu.Callings stamps the real Herbalist level as the brewer's grade.
# Elixirs are retuned from game-breaking to boss-fight strength (ADR-0024).
#
#   Lock Configuration = On   - server admins only; the elixir numbers are difficulty.
#   Tonics Requirement Level - all three at the minimum, 1; no separate higher tier skill gate
#                              (2026-10-06 owner). Personal tonic drinking keys stay in Callings.
#   Elixir recipes            - all eight kept (package defaults, pinned because they are a decision).
#   Berserker 1.25, Swift 1.2, Jump 1.5, Fast Learner 1.5
#                             - shipped at 5, 5, 2 and 3. Strong enough to buy for every hard fight,
#                               not strong enough to replace Oathbound talents. Fast Learner speeds
#                               vanilla skills only; Lembitu.Callings applies the steep curve after it.
#   Invisibility and Heavy Lifter last 60 s
#                             - their effects are fixed in code: an escape, not a stroll through the
#                               Mistlands; long enough to load a cart, not a replacement for Hauling.
#                               Defender and Slow Fall stay as shipped.
# Durations use the brewer's grade, up to x1.75 at grade 5, never the drinker's Herbalist skill.
#   Exp Loss Amount = 0       - the package default, pinned: Lembitu.Callings drains a non-focus
#                               Herbalist by World Advancement Progression's rule and floor, and a
#                               focus keeps its XP (ADR-0022). A loss here would bypass the floor.
#   Exp Gain Factor = 2       - package 1 (2026-10-06, ADR-0030): half of the step the pace audit
#                               found a focus herbalist needs to progress alongside its biome.
#                               Potion Crafting Exp Gain Factor and the 30 s gathering cooldown
#                               stay as shipped.

[1- ServerSync]
Lock Configuration = On

[4- Tonics Requirement Level]
Minor Tonics Level = 1
Medium Tonics Level = 1
Large Tonics Level = 1

[5- Skill Exp]
Exp Gain Factor = 2
Exp Loss Amount = 0

[BerserkerElixir]
