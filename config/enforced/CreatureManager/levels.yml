# Enforced CreatureManager table: fixed difficulty (2026-10-06, owner).
# Global health 2, damage 1; health grows by 0.75 per level above 1.
# Hard biome levels remain for ordinary creatures; bosses do not follow them.
# Boss health 5, damage 1.5: every regular boss is level 1, tuned for five players.
# Combat hard stays: boss damage is 2.25x vanilla; headcount scaling is off.
# Kall phase 2 is exempt in the mod; Karma and Enforcers are unchanged.
# Modifier rolls: one independent draw per group, uniform [0,max(100,total)].
# (CreatureManager RollConfiguredMask:22412-22458, 1.2.5 decompile.)
# Global totals: 8 * 0.679 = 5.432%; 6 * 0.905 = 5.43%.
# P(any) = 1 - (1-.05432)^2 * (1-.05430)^2 = 20.02%.
# Boss offence: 8 * 12.5 = 100%, guaranteed; defence: 2 * 16.5 = 33%;
# affliction: 8 * 4.125 = 33%; utility: 6 * 5.5 = 33%.
# Bosses carry 1..4 modifiers, expected count 1 + 3*.33 = 1.99.
# Unflinching is zero for bosses: non-staggering bosses cannot roll it, so
# armored/reflection alone hold defence at 33% (2026-10-06, owner target).
# Ordinary totals are nominal: ineligible unflinching/chameleon reduce them.
# Deathward, regenerating, omen and blamer stay zero everywhere.
# Vortex, adaptive and chameleon stay zero for bosses and Enforcers.
# Enforcers use karma.yml; only unnamed modifiers inherit from this table.
# Targets: Global, Boss, biome, group or prefab; omitted fields inherit independently.
# Priority: non-boss/Enforcer prefab > group > biome > Global; boss prefab > group > Boss.
# Nested biome blocks override their parent; modifiers omit/{} inherit, [] clears.
# Tuples begin with chance%; only trailing parameters may be omitted.
#
Global:
  level: [80, 20]                       # Weights by level: level 1 = 80, level 2 = 20.
  scalePerLevel: 0.1                    # Visual scale per level above 1; skipped in dungeons.
  damage: 1.0                          # Level-1 damage multiplier.
  damagePerLevel: 0.15                 # Replaces vanilla growth: damage * (1 + (level - 1) * value).
  health: 2                            # Level-1 max-health multiplier.
  healthPerLevel: 0.75                 # Gentler stars (2026-10-06, owner).
#   distanceScaling: [0.03, 0.08, 1000, 5] # damageStep, healthStep, stepMeters, maxSteps (0 = unlimited).
#   modifierDistanceScaling: [0.03, 1000, 8] # chanceStep, stepMeters, maxSteps; 20% -> 20.6% at 1000m, 24.8% at 8000m+.
  modifiers:                           # One per group; totals below 100 allow none, above 100 are weights.
    # Offense: Enraged to Undodgeable
    enraged: 0.679, 0.15                 # chance%, outgoingDamageBonus
    fire: 0.679, 0.2                     # chance%, addedFireDamage
    frost: 0.679, 0.1                    # chance%, addedFrostDamage
    lightning: 0.679, 0.1                # chance%, addedLightningDamage
    spirit: 0.679, 0.05                  # chance%, addedSpiritDoT
    armorPiercing: 0.679, 0.3            # chance%, ignoredPlayerArmor
    staggering: 0.679, 0.6               # chance%, staggerBonus
    undodgeable: 0.679, 0.25             # chance%, damageReduction
    # Defense: Armored to Chameleon
    armored: 0.905, 0.3                 # chance%, damageReduction
    deathward: 0, 0.2, 10, 3         # chance%, restoredHealth, cooldownSeconds, maxActivations
    regenerating: 0, 0.01, 20      # chance%, maxHealthRatioPerSecond, healthPerSecondCap (0 = unlimited)
    reflection: 0.905, 0.1, 0.5         # chance%, actualMeleeDamageReflected, procChance
    vortex: 0.905, 0.5                  # chance%, projectileIgnoreProc
    adaptive: 0.905, 0.5                # chance%, rememberedTypeDamageReduction
    unflinching: 0.905                    # chance%
    chameleon: 0.905, 10                  # chance%, immunitySwitchSeconds
    # Affliction: Exposed to ToxicDeath
    exposed: 0.679, 0.2, 0.5, 5          # chance%, damageTaken, proc, duration
    weakened: 0.679, 0.2, 0.5, 5         # chance%, outgoingDamageReduction, proc, duration
    withered: 0.679, 0.5, 0.5, 5         # chance%, healingReduction, proc, duration
    crippling: 0.679, 0.5, 0.5, 0.5, 5  # chance%, moveReduction, jumpReduction, proc, duration
    disruptive: 0.679, 0.5, 0.5, 0.5, 5  # chance%, staminaRegenReduction, eitrRegenReduction, proc, duration
    adrenalineDrain: 0.679, 0.5, 0.5, 0.5, 5 # chance%, currentAdrenalineRemoved, adrenalineGainReduction, procChance, duration
    corrosive: 0.679, 0.5, 0.5, 5          # chance%, durabilityLossBonus, procChance, duration
    toxicDeath: 0.679, 0.3, 4, blob_aoe   # chance%, maxHealthDamage, radius, triggerEffect
    # Special: Swift to Blamer
    swift: 0.905, 0.4                  # chance%, movementSpeedBonus
    attackSpeed: 0.905, 0.3            # chance%, attackSpeedBonus
    vampiric: 0.905, 0.3               # chance%, actualDirectDamageHealing
    reaping: 0.905, 0.05, 20, 0.1, 2, 0.01, 0.2, 0.05, 0.5 # chance%, heal/base, healMaxActivations, maxHealth/base, maxHealthCap, damagePerKill, damageCap, scalePerKill, scaleCap
    blink: 0.905, 6, 16, fx_Adrenaline1  # chance%, cooldown, maxRange, startEffect
    omen: 0, 0.5                  # chance%, forcedEnforcerChance
    juggernaut: 0.905, 150, 5           # chance%, minimumPushForce, cooldownSeconds
    blamer: 0, 0.5, 45, 0.75           # chance%, karmaPerSecond, maxKarmaGain (0 = unlimited), fleeHealthRatio

Boss:                                  # Regular bosses only; Enforcers use non-boss rules.
  # level omitted: level 1 with Bosses Follow Biome Level Preset Off.
  scalePerLevel: 0.1
  damage: 1.5
  damagePerLevel: 0.05
  health: 5                            # Five-player boss target (2026-10-06, owner).
  healthPerLevel: 0.5
  modifiers:                           # One per group; totals below 100 allow none, above 100 are weights.
    # Offense: Enraged to Undodgeable
    enraged: 12.5, 0.15                 # chance%, outgoingDamageBonus
    fire: 12.5, 0.2                     # chance%, addedFireDamage
    frost: 12.5, 0.1                    # chance%, addedFrostDamage
    lightning: 12.5, 0.1                # chance%, addedLightningDamage
    spirit: 12.5, 0.05                  # chance%, addedSpiritDoT
    armorPiercing: 12.5, 0.3            # chance%, ignoredPlayerArmor
    staggering: 12.5, 0.6               # chance%, staggerBonus
    undodgeable: 12.5, 0.25             # chance%, damageReduction
    # Defense: Armored to Chameleon
    armored: 16.5, 0.3                 # chance%, damageReduction
    deathward: 0, 0.2, 10, 3         # chance%, restoredHealth, cooldownSeconds, maxActivations
    regenerating: 0, 0.002, 20      # chance%, maxHealthRatioPerSecond, healthPerSecondCap (0 = unlimited)
    reflection: 16.5, 0.1, 0.5         # chance%, actualMeleeDamageReflected, procChance
    vortex: 0, 0.5                  # chance%, projectileIgnoreProc (0 since 2026-10-05: counters ranged classes)
    adaptive: 0, 0.5                # chance%, rememberedTypeDamageReduction (0 since 2026-10-05: counters ranged classes)
    unflinching: 0                    # Ineligible on non-staggering bosses; keep defence at 33%.
    chameleon: 0, 10                  # chance%, immunitySwitchSeconds (0 since 2026-10-05: counters caster classes)
    # Affliction: Exposed to ToxicDeath
    exposed: 4.125, 0.2, 0.5, 5          # chance%, damageTaken, proc, duration
    weakened: 4.125, 0.2, 0.5, 5         # chance%, outgoingDamageReduction, proc, duration
    withered: 4.125, 0.5, 0.5, 5         # chance%, healingReduction, proc, duration
    crippling: 4.125, 0.5, 0.5, 0.5, 5  # chance%, moveReduction, jumpReduction, proc, duration
    disruptive: 4.125, 0.5, 0.5, 0.5, 5  # chance%, staminaRegenReduction, eitrRegenReduction, proc, duration
    adrenalineDrain: 4.125, 0.5, 0.5, 0.5, 5 # chance%, currentAdrenalineRemoved, adrenalineGainReduction, procChance, duration
    corrosive: 4.125, 0.5, 0.5, 5          # chance%, durabilityLossBonus, procChance, duration
    toxicDeath: 4.125, 0.3, 4, blob_aoe   # chance%, maxHealthDamage, radius, triggerEffect
    # Special: Swift to Blamer
    swift: 5.5, 0.4                  # chance%, movementSpeedBonus
    attackSpeed: 5.5, 0.3            # chance%, attackSpeedBonus
    vampiric: 5.5, 0.3               # chance%, actualDirectDamageHealing
    reaping: 5.5, 0.05, 20, 0.1, 2, 0.01, 0.2, 0.05, 0.5 # chance%, heal/base, healMaxActivations, maxHealth/base, maxHealthCap, damagePerKill, damageCap, scalePerKill, scaleCap
    blink: 5.5, 6, 16, fx_Adrenaline1  # chance%, cooldown, maxRange, startEffect
    omen: 0, 0.5                  # chance%, forcedEnforcerChance
    juggernaut: 5.5, 150, 5           # chance%, minimumPushForce, cooldownSeconds
    blamer: 0, 1, 60, 0.75           # chance%, karmaPerSecond, maxKarmaGain (0 = unlimited), fleeHealthRatio

TentaRoot:
  modifiers: []                       # Clears inherited modifiers for this prefab.

