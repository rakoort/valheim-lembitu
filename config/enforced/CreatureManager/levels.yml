# Enforced level table for CreatureManager (#68). This file is pinned wholesale, like the other
# CreatureManager data files: the mod owns its shape, and committing it is what makes a package
# default that ships different numbers a review rather than a silent rebalance.
#
# Two numbers are ours; everything else is the package's own table, unchanged.
#
#   Global health 2   ordinary creatures, and Enforcers, carry twice vanilla health.
#   Boss health 8     regular bosses carry eight.
#
# They exist because headcount scaling is off (`sighsorry.CreatureManager.cfg`,
# [4 - Multiplayer Difficulty]). Vanilla makes a creature tougher for each player standing
# nearby, which means a fight's difficulty depends on who happened to log in. This run fixes the
# difficulty instead: a boss is the same fight for two players or for eight, and the group
# decides how many to bring rather than being punished for bringing them.
#
# Damage is deliberately untouched at 1. Health is the lever because it lengthens a fight without
# making it one-shot a player; multiplying damage as well would just move deaths earlier.
#
# The per-level growth below still compounds on top, so these are floors rather than ceilings: an
# Ashlands creature at level 3 is 2 * (1 + 2 * 1) = 6x vanilla health, and a level-2 boss is
# 8 * 1.5 = 12x. `Biome Level Preset = Hard` is what decides how often a high level is rolled.
#
# Global health was 4 until 2026-09-17, when character level left the Pack (#80). Attribute points
# went with it, so every character lost the health, stamina and damage it had bought; halving
# ordinary creature health is what keeps the fight where it was rather than making the removal a
# difficulty increase nobody chose. Bosses are untouched: a boss fight is a group's whole evening
# and twelve players pool damage into one target.
#
# Ordinary-creature modifier chances are 0.25 each, a twentieth of the package's 5, because the
# stock numbers read as a per-creature rate and are not one. The mod rolls **one modifier per
# group**, and there are four groups of eight below, so 5 each meant a 40% roll per group and about
# 1.7 modifiers on every creature. Twelve players met that on 2026-09-16 and ordinary mobs took
# eight people to kill. At 0.25 a group fires 2% of the time, so roughly one creature in thirteen
# carries a modifier and almost never two: a meaningful moment rather than the weather.
#
# Enforcers are unaffected. Their chances are their own, 10 each in `karma.yml`'s `Enforcer.modifiers`,
# which inherits from this file only for a modifier it does not name. Modifiers stay the Enforcer's
# signature, which is what CONTEXT.md means by one. Boss chances below are untouched.
# Targets: Global, Boss, biome, group, or prefab; omitted fields inherit independently.
# Priority: non-boss/Enforcer prefab > group > biome > Global; regular boss prefab > group > Boss.
# Nested biome blocks override their parent target in that biome.
# modifiers: omit/{} = inherit, [] = clear; tuples start with chance% and may omit only trailing values.
#
Global:
  level: [80, 20]                       # Weights by level: level 1 = 80, level 2 = 20.
  scalePerLevel: 0.1                    # Visual scale per level above 1; skipped in dungeons.
  damage: 1                            # Level-1 damage multiplier.
  damagePerLevel: 0.25                 # Replaces vanilla growth: damage * (1 + (level - 1) * value).
  health: 2                            # Level-1 max-health multiplier.
  healthPerLevel: 1                    # Health = base * health * (1 + (level - 1) * value).
#   distanceScaling: [0.03, 0.08, 1000, 5] # damageStep, healthStep, stepMeters, maxSteps (0 = unlimited).
#   modifierDistanceScaling: [0.03, 1000, 8] # chanceStep, stepMeters, maxSteps; 20% -> 20.6% at 1000m, 24.8% at 8000m+.
  modifiers:                           # One per group; totals below 100 allow none, above 100 are weights.
    # Offense: Enraged to Undodgeable
    enraged: 0.25, 0.15                 # chance%, outgoingDamageBonus
    fire: 0.25, 0.2                     # chance%, addedFireDamage
    frost: 0.25, 0.1                    # chance%, addedFrostDamage
    lightning: 0.25, 0.1                # chance%, addedLightningDamage
    spirit: 0.25, 0.05                  # chance%, addedSpiritDoT
    armorPiercing: 0.25, 0.3            # chance%, ignoredPlayerArmor
    staggering: 0.25, 0.6               # chance%, staggerBonus
    undodgeable: 0.25, 0.25             # chance%, damageReduction
    # Defense: Armored to Chameleon
    armored: 0.25, 0.3                 # chance%, damageReduction
    deathward: 0.25, 0.2, 10, 3         # chance%, restoredHealth, cooldownSeconds, maxActivations
    regenerating: 0.25, 0.01, 20      # chance%, maxHealthRatioPerSecond, healthPerSecondCap (0 = unlimited)
    reflection: 0.25, 0.1, 0.5         # chance%, actualMeleeDamageReflected, procChance
    vortex: 0.25, 0.5                  # chance%, projectileIgnoreProc
    adaptive: 0.25, 0.5                # chance%, rememberedTypeDamageReduction
    unflinching: 0.25                    # chance%
    chameleon: 0.25, 10                  # chance%, immunitySwitchSeconds
    # Affliction: Exposed to ToxicDeath
    exposed: 0.25, 0.2, 0.5, 5          # chance%, damageTaken, proc, duration
    weakened: 0.25, 0.2, 0.5, 5         # chance%, outgoingDamageReduction, proc, duration
    withered: 0.25, 0.5, 0.5, 5         # chance%, healingReduction, proc, duration
    crippling: 0.25, 0.5, 0.5, 0.5, 5  # chance%, moveReduction, jumpReduction, proc, duration
    disruptive: 0.25, 0.5, 0.5, 0.5, 5  # chance%, staminaRegenReduction, eitrRegenReduction, proc, duration
    adrenalineDrain: 0.25, 0.5, 0.5, 0.5, 5 # chance%, currentAdrenalineRemoved, adrenalineGainReduction, procChance, duration
    corrosive: 0.25, 0.5, 0.5, 5          # chance%, durabilityLossBonus, procChance, duration
    toxicDeath: 0.5, 0.3, 4, blob_aoe   # chance%, maxHealthDamage, radius, triggerEffect
    # Special: Swift to Blamer
    swift: 0.25, 0.4                  # chance%, movementSpeedBonus
    attackSpeed: 0.25, 0.3            # chance%, attackSpeedBonus
    vampiric: 0.25, 0.3               # chance%, actualDirectDamageHealing
    reaping: 0.25, 0.05, 20, 0.1, 2, 0.01, 0.2, 0.05, 0.5 # chance%, heal/base, healMaxActivations, maxHealth/base, maxHealthCap, damagePerKill, damageCap, scalePerKill, scaleCap
    blink: 0.25, 6, 16, fx_Adrenaline1  # chance%, cooldown, maxRange, startEffect
    omen: 0.25, 0.5                  # chance%, forcedEnforcerChance
    juggernaut: 0.25, 150, 5           # chance%, minimumPushForce, cooldownSeconds
    blamer: 0.25, 0.5, 45, 0.75           # chance%, karmaPerSecond, maxKarmaGain (0 = unlimited), fleeHealthRatio

Boss:                                  # Regular bosses only; Enforcers use non-boss rules.
  # level: [100]                       # Boss fallback: level 1; omit to allow the enabled built-in biome preset ([] is invalid).
  scalePerLevel: 0.1
  damage: 1
  damagePerLevel: 0.1
  health: 8
  healthPerLevel: 0.5
  modifiers:                           # One per group; totals below 100 allow none, above 100 are weights.
    # Offense: Enraged to Undodgeable
    enraged: 10, 0.15                 # chance%, outgoingDamageBonus
    fire: 10, 0.2                     # chance%, addedFireDamage
    frost: 10, 0.1                    # chance%, addedFrostDamage
    lightning: 10, 0.1                # chance%, addedLightningDamage
    spirit: 10, 0.05                  # chance%, addedSpiritDoT
    armorPiercing: 10, 0.3            # chance%, ignoredPlayerArmor
    staggering: 10, 0.6               # chance%, staggerBonus
    undodgeable: 10, 0.25             # chance%, damageReduction
    # Defense: Armored to Chameleon
    armored: 10, 0.3                 # chance%, damageReduction
    deathward: 10, 0.2, 10, 3         # chance%, restoredHealth, cooldownSeconds, maxActivations
    regenerating: 10, 0.002, 20      # chance%, maxHealthRatioPerSecond, healthPerSecondCap (0 = unlimited)
    reflection: 10, 0.1, 0.5         # chance%, actualMeleeDamageReflected, procChance
    vortex: 10, 0.5                  # chance%, projectileIgnoreProc
    adaptive: 10, 0.5                # chance%, rememberedTypeDamageReduction
    unflinching: 10                    # chance%
    chameleon: 10, 10                  # chance%, immunitySwitchSeconds
    # Affliction: Exposed to ToxicDeath
    exposed: 10, 0.2, 0.5, 5          # chance%, damageTaken, proc, duration
    weakened: 10, 0.2, 0.5, 5         # chance%, outgoingDamageReduction, proc, duration
    withered: 10, 0.5, 0.5, 5         # chance%, healingReduction, proc, duration
    crippling: 10, 0.5, 0.5, 0.5, 5  # chance%, moveReduction, jumpReduction, proc, duration
    disruptive: 10, 0.5, 0.5, 0.5, 5  # chance%, staminaRegenReduction, eitrRegenReduction, proc, duration
    adrenalineDrain: 10, 0.5, 0.5, 0.5, 5 # chance%, currentAdrenalineRemoved, adrenalineGainReduction, procChance, duration
    corrosive: 10, 0.5, 0.5, 5          # chance%, durabilityLossBonus, procChance, duration
    toxicDeath: 10, 0.3, 4, blob_aoe   # chance%, maxHealthDamage, radius, triggerEffect
    # Special: Swift to Blamer
    swift: 10, 0.4                  # chance%, movementSpeedBonus
    attackSpeed: 10, 0.3            # chance%, attackSpeedBonus
    vampiric: 10, 0.3               # chance%, actualDirectDamageHealing
    reaping: 10, 0.05, 20, 0.1, 2, 0.01, 0.2, 0.05, 0.5 # chance%, heal/base, healMaxActivations, maxHealth/base, maxHealthCap, damagePerKill, damageCap, scalePerKill, scaleCap
    blink: 10, 6, 16, fx_Adrenaline1  # chance%, cooldown, maxRange, startEffect
    omen: 10, 0.5                  # chance%, forcedEnforcerChance
    juggernaut: 10, 150, 5           # chance%, minimumPushForce, cooldownSeconds
    blamer: 0, 1, 60, 0.75           # chance%, karmaPerSecond, maxKarmaGain (0 = unlimited), fleeHealthRatio

TentaRoot:
  modifiers: []                       # Clears inherited modifiers for this prefab.

