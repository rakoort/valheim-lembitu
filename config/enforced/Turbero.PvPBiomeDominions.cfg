# Enforced server config for PvPBiomeDominions (#25): no biome-forced PvP anywhere. The mod
# defaults every biome rule to Pvp; we turn all nine to PlayerChoice, so PvP stays a flag each
# player owns (#8, #14). Position-sharing rules in [3 - Map Position] share these key names and
# are deliberately not listed: only the PvP section is ours to enforce.

[1 - General]
Lock Configuration = true

[2 - PvP Settings]
Biome 1 - Meadows Rule = PlayerChoose
Biome 2 - Black Forest Rule = PlayerChoose
Biome 3 - Swamp Rule = PlayerChoose
Biome 4 - Mountain Rule = PlayerChoose
Biome 5 - Plains Rule = PlayerChoose
Biome 6 - Mistlands Rule = PlayerChoose
Biome 7 - Ashlands Rule = PlayerChoose
Biome 8 - Deep North Rule = PlayerChoose
Biome 9 - Ocean Rule = PlayerChoose
