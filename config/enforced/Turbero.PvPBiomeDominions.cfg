# Enforced server config for PvPBiomeDominions (#25, #8): no biome-forced PvP anywhere, and the
# death rules that make opting into PvP worth it. The mod defaults every biome rule to Pvp; we
# turn all nine to PlayerChoose, so PvP stays a flag each player owns (#8, #14). Position-sharing
# rules in [3 - Map Position] share these key names and are deliberately not listed: only the PvP
# section is ours to enforce.
#
# Retention keys off the victim's own PvP flag (Player.CreateTombStone), and loot permission off
# the looter's, so a flagged player keeps their equipped items and hotbar and only flagged players
# can rob a grave. The PvE values equal the mod's defaults; they are pinned anyway, because they
# are the rules for everyone who has not opted in and an upstream default flip must not change
# them silently.
#
# Retention is death-cause blind: the mod's tombstone patch takes no killer. A flagged player who
# drowns keeps their gear too. That is the mod's limit, not a setting.

[1 - General]
Lock Configuration = true

[2 - PvP Settings]
Biome 1 - Meadows Rule = PlayerChoose
Biome 2 - Black Forest Rule = PlayerChoose
Biome 3 - Swamp Rule = PlayerChoose
Biome 4 - Mountain Rule = PlayerChoose
Biome 5 - Plains Rule = PlayerChoose
Biome 6 - Mistlands Rule = PlayerChoose
Biome 7 - Ashlands Rule = PlayerChoose
Biome 8 - Deep North Rule = PlayerChoose
Biome 9 - Ocean Rule = PlayerChoose

# A second way to force PvP, independent of the biome rules: PvPWardRule.Pvp would make every ward
# a PvP zone regardless of biome. Pinned to the value that defers to the biome rules above.
PvP Rule In Wards (override biome) = FollowBiomeRule

# The footgun this ticket exists to close. The loot restriction lives in a Container.Interact
# prefix that returns early - allowing everyone to loot every grave - when either the alert toggle
# is Off or this message is empty. The message is therefore load-bearing config, not decoration.
[5 - Translations]
Tombstone Looting Alert Message = <color=red>{0} is looting your tombstone!</color>

[7 - Tombstones]
Show Message When Looting Your Tombstone = On

# Not opted in: the vanilla death penalty, and no robbing graves.
[7.1 - Tombstones PvE]
PvE - Allow Loot Other Tombstones = Off
PvE - No Items Loss On Death = Off
PvE - Keep Equipped Items On Death = Off
PvE - Keep Hotbar Items On Death = Off

# Opted in: keep what you were carrying in hand and on the hotbar, and you may loot a grave. The
# tombstone still has to exist for either to mean anything, so no-item-loss stays off.
[7.2 - Tombstones PvP]
PvP - Allow Loot Other Tombstones = On
PvP - No Items Loss On Death = Off
PvP - Keep Equipped Items On Death = On
PvP - Keep Hotbar Items On Death = On
