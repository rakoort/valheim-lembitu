# Enforced server config for World Advancement Progression (#66, #68, ADR-0010): personal keys are
# the fixed point (ADR-0005). Private keys on, the world's global key list blocked outright, raids
# evaluated per player, and progression gates the actions the project decided it should.
#
# `BlockAllGlobalKeys` and `UsePrivateKeys` already default to true; they are pinned because a flip
# would hand the first clan's boss kill to the whole roster.
#
# What is key-locked, and why each one:
#
#   LockEquipment, LockCrafting   - the two ADR-0005 names. Biome gear follows the character's own
#                                   boss kills, so a clan cannot hand a newcomer endgame equipment.
#   LockCooking, LockEating       - added by the 2026-09-16 review, amending ADR-0005, which had
#                                   them open. Every lock is material-scoped, so a keyless character
#                                   still cooks and eats Meadows food.
#   LockGuardianPower             - forsaken powers are vanilla and gated per character by those
#                                   keys (ADR-0004). This is the gate BossRules was cut for:
#                                   docs/modstack.md records that World Advancement Progression
#                                   already covers boss summons and guardian powers per key.
#   LockBossSummons               - a clan summons the boss its own keys allow; presence at another
#                                   clan's kill is what earns the key (ADR-0005).
#
# What is deliberately unlocked, all of it non-default:
#
#   LockEquipmentRepair, LockBuilding, LockBuildingRepair
#       default to On and ADR-0005 says building and repairs stay open. Pinning them Off is the
#       point of this overlay: an upstream default is not a decision.
#
# `AdminBypass` stays off so an admin plays the same run as everyone else, and
# `UnlockBossSummonsOverTime` stays off so an altar never opens itself on a timer.
#
# The key-name settings - boats, portals and the nine `[PortalUnlocking]` entries - are pinned
# empty. Empty means vanilla: hauling ore through a portal stays impossible, which is the hard
# `-modifier Portals hard` launch rule expressed a second time, and a package default that named a
# key here would quietly hand out portals.

[Keys]
BlockAllGlobalKeys = true
UsePrivateKeys = true

[Locking]
AdminBypass = false
LockEquipment = true
LockCrafting = true
LockCooking = true
LockEating = true
LockGuardianPower = true
LockBossSummons = true
LockEquipmentRepair = false
LockBuilding = false
LockBuildingRepair = false
LockTaming = false
UnlockBossSummonsOverTime = false
LockBoatsKey = 
LockPortalsKey = 

[PortalUnlocking]
UnlockPortalCopperTinKey = 
UnlockPortalIronKey = 
UnlockPortalSilverKey = 
UnlockPortalBlackMetalKey = 
UnlockPortalFlametalKey = 
UnlockPortalDragonEggKey = 
UnlockPortalMistlandsKey = 
UnlockPortalAshlandsKey = 
UnlockPortalHildirChestsKey = 

[Raids]
UsePrivateRaids = true

# The skill manager is on, as the 2026-09-16 review decided, but only as a floor that follows
# personal keys. `SkillsManager.UpdateCache` picks floor and ceiling independently: overriding the
# maximum at 100 leaves the ceiling where vanilla has it, while `UseBossKeysForSkillLevel` raises
# the floor by `BossKeysSkillPerKey` for every private key the character holds. A player who was
# there for five boss kills therefore starts a fresh skill at 50 rather than grinding it from zero,
# and nobody's skill ceiling moves. Drain stays on, and relative rather than absolute, so dying
# still costs a proportion of progress.
[Skills]
EnableSkillManager = true
AllowSkillDrain = true
UseAbsoluteSkillDrain = false
OverrideMinimumSkillLevel = false
OverrideMaximumSkillLevel = true
MaximumSkillLevel = 100
UseBossKeysForSkillLevel = true
BossKeysSkillPerKey = 10
