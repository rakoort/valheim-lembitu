# Enforced server config for World Advancement Progression (#66, ADR-0010): personal keys are the
# fixed point (ADR-0005). Private keys on, the world's global key list blocked outright, raids
# evaluated per player, and progression gates the actions the project decided it should.
#
# `BlockAllGlobalKeys` and `UsePrivateKeys` already default to true; they are pinned because a flip
# would hand the first clan's boss kill to the whole roster.
#
# What is key-locked, and why each one:
#
#   LockEquipment, LockCrafting   - the two ADR-0005 names. Biome gear follows the character's own
#                                   boss kills, so a clan cannot hand a newcomer endgame equipment.
#   LockGuardianPower             - forsaken powers are vanilla and gated per character by those
#                                   keys (ADR-0004). This is the gate BossRules was cut for:
#                                   docs/modstack.md records that World Advancement Progression
#                                   already covers boss summons and guardian powers per key.
#   LockBossSummons               - a clan summons the boss its own keys allow; presence at another
#                                   clan's kill is what earns the key (ADR-0005).
#
# What is deliberately unlocked, all of it non-default:
#
#   LockEquipmentRepair, LockBuilding, LockBuildingRepair, LockCooking, LockEating
#       default to On and ADR-0005 says building, cooking, eating and repairs stay open. Pinning them
#       Off is the point of this overlay: an upstream default is not a decision.
#
# Portals and boats are not listed. Their keys are blank strings, so vanilla behaviour stands; there
# is no lock to turn off. LockTaming also stays out: its own default is already false.

[Keys]
BlockAllGlobalKeys = true
UsePrivateKeys = true

[Locking]
LockEquipment = true
LockCrafting = true
LockGuardianPower = true
LockBossSummons = true
LockEquipmentRepair = false
LockBuilding = false
LockBuildingRepair = false
LockCooking = false
LockEating = false

[Raids]
UsePrivateRaids = true

[Skills]
# Character level owns progression (ADR-0004); the mod's own skill manager is a third curve, and
# World Advance Progression's default leaves it on.
EnableSkillManager = false
