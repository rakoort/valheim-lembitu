# Enforced server config for ProgressivePowers (2026-10-04, ADR-0019). The boss-power pillar:
# Forsaken powers are passive bonuses that grow over seven mastery levels as bosses are killed.
#
#   Kill Credit Range = 100       - package 200. Mastery credit reaches players within 100 m of the dead
#                                   boss, the same radius as boss keys and guild kill XP, so presence
#                                   means one distance. Boss keys measure from the player whose game
#                                   controls the boss rather than from the boss, a small difference.
#   Max Attuned Powers = 1        - package default, pinned: one attuned power at a time.
#   Block Power Activation = true - package default, pinned: the vanilla active power is replaced by
#                                   the passive bonuses.
#   Enable Advanced Power Config = false - package default, pinned: the stock mastery table and effects.

[General]
Kill Credit Range = 100
Max Attuned Powers = 1
Block Power Activation = true
Enable Advanced Power Config = false

# Live's value (read 2026-10-27), kept for the Pool: the Workload copies this file whole, so a key
# left out returns to its default (docs/server-image.md, "The config"). Package default 2.
[Client config]
Full Power Displays = 1
