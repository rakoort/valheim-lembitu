# Enforced server config for FineDining (2026-10-06, ADR-0029). Spoilage and freshness on; every
# feature that rewards the eater rather than the cook off.
#
#   [1 - General]  Locked to the server. No Cooking XP for eating and no Cooking production bonus:
#                  ImpactfulSkills' bonus servings at Cooking 40 stay the cook's one extra-output
#                  perk (ADR-0024). The vanilla fermenter is excluded, so meads, the alchemist's
#                  goods, keep vanilla timing and output and grant no Cooking XP.
#   [3 - Diet]     Three food slots as in vanilla. Food Stat Scale 1.1 makes a fresh dish 110% of
#                  vanilla; freshness falls linearly to Stale Food Minimum Multiplier, so a stale dish
#                  gives 1.1 x 0.75 = 82.5%. No diminishing returns and no Full Course.
#   [4 - Chef Choice] Off: its bonus reads the eater's Cooking skill, not the cook's.
#   [5 - Spoilage] Lifetimes and the preserved foods live in FineDining/Spoilage.yml. Nothing spoils
#                  in the Mountains or Deep North; the Icebox (Mountains materials) pauses spoilage,
#                  two per Steam account, four rows of eight.
#
# The cook's grade, its longer shelf life and the work meals are Lembitu.Callings'
# (config/enforced/lembitu.callings.cfg).

[1 - General]
Lock Server Configuration = true
Cooking Experience per Food Eaten = 0
Production Bonus Chance at Max Cooking (%) = 0
Fermenter Output Bonus Chance at Max Cooking (%) = 0
Fermenter Bonus Excluded Prefabs = fermenter

[3 - Diet]
Maximum Food Slots = 3
Food Stat Scale = 1.1
Full Course Enabled = false
Diminishing Returns Enabled = false
Puke Food Removal Order = Random

[4 - Chef Choice]
Chef Choice Enabled = false

[5 - Spoilage]
Spoilage Mode = FollowYaml
Stale Food Minimum Multiplier = 0.75
No-Spoil Biomes = Mountain, DeepNorth
Icebox Default Placement Limit = 2
Icebox Storage Rows = 4
Icebox Build Recipe = TrophySGolem:1,Obsidian:8,Crystal:16,Silver:32
