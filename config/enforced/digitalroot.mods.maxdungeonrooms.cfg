# Enforced server config for Max Dungeon Rooms (#68). World-permanent under ADR-0009: dungeon
# room counts are written into the world save when a dungeon first generates, so these values
# were fixed before the launch world existed and cannot be changed during the run without
# producing two kinds of dungeon in one world.
#
# 20 to 40 rooms against a vanilla 8 to 20: a crypt is a place you spend an evening in, which is
# what makes Karma's dungeon Enforcers worth meeting.
#
# The three per-dungeon overrides stay disabled so the general range is the only rule. They are
# pinned because each one, if a package default ever turned it on, would quietly shrink one
# dungeon family back towards vanilla.

[1. General]
Min Rooms = 20
Max Rooms = 40

[2. Forest Crypt Overrides]
Enable Forest Crypt Override = false

[3. Sunken Crypt Overrides]
Enable Sunken Crypt Override = false

[4. Cave Overrides]
Enable Cave Override = false
