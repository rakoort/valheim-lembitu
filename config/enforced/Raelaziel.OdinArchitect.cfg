# Live's values (read 2026-10-27), kept for the Pool. The live server's file holds these two
# elevator recipes, which differ from the package's (IronNails:14,Wood:4 and IronNails:4 with no
# Wood). The Workload copies this file whole and the mod adds every other key at its default, so
# without them the elevators would get cheaper at the move (docs/server-image.md, "The config").

[Simple elevator]
Crafting Costs = SurtlingCore:3:True,Iron:6:True,IronNails:20:True,Wood:10:True

[Simple small elevator]
Crafting Costs = SurtlingCore:2:True,Iron:3:True,IronNails:10:True,Wood:6:True
