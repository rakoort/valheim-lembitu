# Live's values (read 2026-10-27), kept for the Pool. The live server's file was written by an older
# version, whose manual-snapping keys sit one place earlier than this version's defaults (Q, F4, F3
# and CapsLock). The Workload copies this file whole and the mod adds every other key at its
# default (docs/server-image.md, "The config"). They are key bindings, which a server never presses;
# they are kept so the move changes no value the live server holds.

[2 - Manual Snapping]
Cycle Grid Snap Precision = F4
Toggle Grid Snap Mode = F3
Toggle Manual Snap Mode = CapsLock
Toggle Manual+ Snap Mode = LeftAlt
