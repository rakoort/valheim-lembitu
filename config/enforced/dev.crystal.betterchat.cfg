# Enforced server config for BetterChat (2026-10-05). The mod's window behaviour (show on message,
# always visible, hide delay, case, slash-open, default channel) is presentation and stays each
# player's own. What the server holds is what its sync policy enforces: the mod registers
# `TalkDistance` and `WhisperDistance` through ConditionalConfigSync's enforced mode
# (BetterChat.dll 1.6.4, `AddConfigEntry(..., ConfigSyncMode.Synced, enforce: true)`), so the
# server's copy decides them for every BetterChat client.
#
# Both keys are pinned at the game's own values, which are the mod's defaults: normal chat carries
# 15 m and a whisper 4 m. That is the whole point of the adoption — the mod adds a chat window and
# convenience without changing who hears what (no global chat, no whispered shouting across a
# base). A client without the mod keeps vanilla chat, which is the same distances, so the mod is
# adopted on both sides and refuses nobody.

[Chat]
TalkDistance = 15
WhisperDistance = 4
