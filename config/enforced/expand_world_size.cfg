# Enforced server config for Expand World Size (#86, ADR-0018): the world is a quarter larger than a
# vanilla one.
#
# These four numbers are the least reversible decision in the project. They are baked into terrain
# when the world generates, so changing any of them afterwards gives two incompatible halves of one
# map. They were applied before the 2026-09-17 world was created and must not be edited while that
# world lives.
#
# `World radius` 12500 against vanilla 10000, and both stretch factors at 1.25. The first world of
# 2026-09-17 was generated at 15000 and 1.5, and the owner rerolled at 1.25 the same day, before
# anyone had built on it. The pair is the whole point: raising the radius alone tiles more biome patches of the same size into a wider disc and
# pads the outside with Ocean, because Ashlands and Deep North are placed by distance from centre.
# Scaling radius and stretch together grows the layout itself, so each biome is a quarter wider and
# every journey between them a quarter longer. Area rises about 1.56 times.
#
# `World edge size` stays at 500 m. It is the impassable water rim beyond the radius, and it needs no
# scaling: it exists to stop a ship, and it stops one just as well at any radius.
#
# Altitude is deliberately untouched at multiplier 1 and delta 0. Stretching terrain horizontally
# already flattens slopes; multiplying height on top of that would change combat and building on
# every hillside, which nobody asked for.
#
# Every client needs this mod, not just the server. Clients generate terrain locally from the seed,
# so a client without it renders different ground than the server holds — the failure is wrong
# terrain rather than a refused join, which is why Pack v12 is mandatory in a harder sense than a
# version handshake.

[1. General]
World radius = 12500
World edge size = 500
Stretch world = 1.25
Stretch biomes = 1.25
Altitude multiplier = 1
Altitude delta = 0
