# Enforced server config for Expand World Size (#86, ADR-0018): a disc a quarter wider than vanilla,
# with terrain and biomes scaled together.
#
# These numbers are the least reversible decision in the project. They are baked into terrain
# when the world generates, so changing any of them afterwards gives two incompatible halves of one
# map. They must not be edited while the world they generated lives.
#
# `World radius` 12500 against vanilla 10000, `Stretch world` 1.25 and `Stretch biomes` 1.25, chosen
# 2026-10-03 for the collaborative world. ADR-0018's 15000/1.5/1.25 was sized so rival clans met
# late; with one cooperative group that reason is gone, and shorter metal runs matter more under
# `Portals hard`. Area rises about 1.56 times.
#
# What each does. Radius sets how far land generates. `Stretch world` spreads the terrain — the
# heightmap, the coastlines — over that larger disc, so raising it with the radius keeps continents
# and seas in proportion instead of tiling more of them. `Stretch biomes` does the same for where
# biomes sit; at the same value as terrain, biome regions scale with the landmass.
#
#
# `World edge size` stays at 500 m. It is the impassable water rim beyond the radius, and it needs no
# scaling: it exists to stop a ship, and it stops one just as well at any radius.
#
# Altitude is deliberately untouched at multiplier 1 and delta 0. Stretching terrain horizontally
# already flattens slopes; multiplying height on top of that would change combat and building on
# every hillside, which nobody asked for.
#
# Forest, water depth and location density stay at vanilla 1, and the Ashlands and Deep North
# placement rules at the package's values. They are pinned (2026-10-03) because each is baked in at
# generation, so an upstream default change must not silently reshape the next world.
#
# Every client needs this mod, not just the server. Clients generate terrain locally from the seed,
# so a client without it renders different ground than the server holds — the failure is wrong
# terrain rather than a refused join, which is why the Pack is mandatory in a harder sense than a
# version handshake.

[1. General]
World radius = 12500
World edge size = 500
Stretch world = 1.25
Stretch biomes = 1.25
Altitude multiplier = 1
Altitude delta = 0
Forest multiplier = 1
Water depth multiplier = 1
Locations = 1

[2. Poles]
Restrict Ashlands position = true
Ashlands width restriction = 7500
Ashlands length restriction = 1000
Ashlands gap = true
Deep North gap = true
Remove Ashlands water = false
