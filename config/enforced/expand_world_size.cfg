# Enforced server config for Expand World Size (#86, ADR-0018): a disc half again as wide, with
# biomes a quarter larger.
#
# These four numbers are the least reversible decision in the project. They are baked into terrain
# when the world generates, so changing any of them afterwards gives two incompatible halves of one
# map. They were applied before the 2026-09-17 world was created and must not be edited while that
# world lives.
#
# `World radius` 15000 against vanilla 10000, `Stretch world` 1.5 and `Stretch biomes` 1.25. The
# three are separate levers and this is the third setting tried on 2026-09-17: 15000/1.5/1.5 first,
# then 12500/1.25/1.25, now radius and terrain at 1.5 with biomes at 1.25.
#
# What each does. Radius sets how far land generates. `Stretch world` spreads the terrain — the
# heightmap, the coastlines — over that larger disc, so raising it with the radius keeps continents
# and seas in proportion instead of tiling more of them. `Stretch biomes` does the same for where
# biomes sit, and holding it at 1.25 while terrain goes to 1.5 makes biome regions a little denser
# than the landmass: more distinct biome neighbourhoods per continent, each a quarter larger than
# vanilla. Area rises about 2.25 times.
#
#
# `World edge size` stays at 500 m. It is the impassable water rim beyond the radius, and it needs no
# scaling: it exists to stop a ship, and it stops one just as well at any radius.
#
# Altitude is deliberately untouched at multiplier 1 and delta 0. Stretching terrain horizontally
# already flattens slopes; multiplying height on top of that would change combat and building on
# every hillside, which nobody asked for.
#
# Every client needs this mod, not just the server. Clients generate terrain locally from the seed,
# so a client without it renders different ground than the server holds — the failure is wrong
# terrain rather than a refused join, which is why Pack v12 is mandatory in a harder sense than a
# version handshake.

[1. General]
World radius = 15000
World edge size = 500
Stretch world = 1.5
Stretch biomes = 1.25
Altitude multiplier = 1
Altitude delta = 0
