# Enforced server config for Expand World Size (#86, ADR-0018, ADR-0019): a disc about 1.76 times
# vanilla's area, with terrain and biomes scaled together.
#
# These numbers are the least reversible decision in the project. They are baked into terrain
# when the world generates, so changing any of them afterwards gives two incompatible halves of one
# map. They must not be edited while the world they generated lives.
#
# Chosen 2026-10-04 for about eight players in rival-but-cooperating guilds with separate starts
# (ADR-0019): more room per guild than the collaborative 12500/1.25/1.25 of 2026-10-03, less sailing
# than ADR-0018's 15000/1.5/1.25, since ore travels by ship and boss nights bring guilds together.
#
# What each does. `World radius` sets how far land generates; area grows with its square, so 13250
# is 1.756x vanilla. `Stretch world` spreads the terrain (heightmap, coastlines) over that disc, and
# matching it to the radius ratio (13250 / 10000 = 1.325) keeps continents and seas in proportion
# instead of tiling more of them. `Stretch biomes` does the same for where biomes sit; held at 1.25,
# below the terrain stretch, each continent carries a few more distinct biome regions.
#
# `Locations` multiplies the maximum number of locations (crypts, villages, camps, traders,
# runestones), not their density (ExpandWorldSize.dll, "Multiplies the max amount of locations").
# At 1 a bigger world spreads vanilla's count thinner; 1.75 keeps them as common as in vanilla.
# An earlier comment here called the value a density.
#
#
# `World edge size` stays at 500 m. It is the impassable water rim beyond the radius, and it needs no
# scaling: it exists to stop a ship, and it stops one just as well at any radius.
#
# Altitude is deliberately untouched at multiplier 1 and delta 0. Stretching terrain horizontally
# already flattens slopes; multiplying height on top of that would change combat and building on
# every hillside, which nobody asked for.
#
# Forest and water depth stay at vanilla 1, and the Ashlands and Deep North placement rules at the
# package's values. They are pinned (2026-10-03) because each is baked in at generation, so an
# upstream default change must not silently reshape the next world.
#
# Every client needs this mod, not just the server. Clients generate terrain locally from the seed,
# so a client without it renders different ground than the server holds — the failure is wrong
# terrain rather than a refused join, which is why the Pack is mandatory in a harder sense than a
# version handshake.

[1. General]
World radius = 13250
World edge size = 500
Stretch world = 1.325
Stretch biomes = 1.25
Altitude multiplier = 1
Altitude delta = 0
Forest multiplier = 1
Water depth multiplier = 1
Locations = 1.75

[2. Poles]
Restrict Ashlands position = true
Ashlands width restriction = 7500
Ashlands length restriction = 1000
Ashlands gap = true
Deep North gap = true
Remove Ashlands water = false
