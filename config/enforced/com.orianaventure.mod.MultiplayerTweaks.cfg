# Enforced server config for Venture Multiplayer Tweaks (2026-10-04, ADR-0019). Every key is synced
# from the server. The mod has no player-scaling setting.
#
#   OverridePlayerPVP = true, ForcePlayerPVPOn = false
#                         - no PvP whatsoever: the toggle is held off for everyone.
#   SkillLossOnAnyDeath = true
#                         - death drains skills; World Advancement Progression's boss-key floor
#                           decides how far, so this mod must not cancel the drain.
#   TeleportOnAnyDeath = true
#                         - respawn at the bed or start as in vanilla; the corpse run is part of
#                           what a death costs.
#   OverridePlayerMapPositions = true, ForcePlayerMapPositionOn = false
#                         - nobody's position is public. Guildmates see each other through Guilds
#                           and party members through SocialSystem.
#   EnableHaldorMapPin, EnableHildirMapPin, EnableBogWitchMapPin = false
#                         - finding the traders is part of exploring, matching BetterMap's trader
#                           reveal off. The start temple keeps its pin.

[General]
AdminBypass = false
OverridePlayerPVP = true
ForcePlayerPVPOn = false
TeleportOnAnyDeath = true
SkillLossOnAnyDeath = true

[Map]
EnableTempleMapPin = true
EnableHaldorMapPin = false
EnableHildirMapPin = false
EnableBogWitchMapPin = false
OverridePlayerMapPositions = true
ForcePlayerMapPositionOn = false
