# Enforced server config for AzuCraftyBoxes (#78): crafting and building pull materials from
# containers near the station. What each choice means is in docs/modstack.md; this file is the
# choices themselves.
#
# Every key below is a `[Synced with Server]` setting, so the server decides it for everyone. The
# mod's client-only keys - the prevent-pulling keybind and its message, the resource-cost string,
# the flash and build-panel colours - are each player's own and are deliberately absent.
#
# `Container Range` is 20 m, which is the workbench build radius players already think in: a chest
# beside the bench feeds it, a storage hut across the base does not. The mod's own default is the
# same number; it is pinned because it is a decision, not because it deviates (CONTEXT.md).
#
# `Leave One Item` is off. On, the mod leaves one of each item in a chest so that other storage
# mods can still find it; this pack has no such mod, and leaving a residue behind would make a
# chest look stocked when it is empty.
#
# `Lock Configuration` is what makes the rest bind. It matters here beyond the usual reason: the
# mod is client-mandatory once the server runs it - a `ZNet.OnNewConnection` prefix invokes
# `AzuCraftyBoxes_VersionCheck` and `ZNet.RPC_PeerInfo` disconnects a peer that never answers - so
# every connected player has the mod and would otherwise hold their own range.
#
# `Azumatt.AzuCraftyBoxes.yml` beside this file is committed empty on purpose: everything in range
# is pullable, and the empty file exists so the package's bundled example cannot introduce
# restrictions on a fresh deployment.

[1 - General]
Lock Configuration = On
Mod Enabled = On
Output Debug Logs = Off

[2 - CraftyBoxes]
Container Range = 20
Leave One Item = Off
