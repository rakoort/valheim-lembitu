# Enforced server config for DynamicLocations (#68). It ships with ValheimRAFT and exists for one
# reason on this server: a bed on a moving vehicle. Without dynamic spawn and logout points a
# player who logs out on a raft wakes where the raft was, not where it is, and a spawn point set
# aboard sends them into open water.
#
# Both keys already default on. They are pinned because they are the whole reason the plugin is
# loaded, and because the failure mode of a silent flip is a drowned character rather than an
# error anyone would read in a log.

[Main]
enableDynamicSpawnPoints = true
enableDynamicLogoutPoints = true
