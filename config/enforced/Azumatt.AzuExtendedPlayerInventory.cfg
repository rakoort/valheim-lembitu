# Enforced server config for AzuExtendedPlayerInventory (#74), which replaced InventorySlots.
# What each choice means and why is in docs/modstack.md; this file is the choices themselves.
#
# The mod is here for one thing: armour out of the backpack. Every key below is a synchronised
# setting, so the server decides it for everyone. The mod's client-only keys - HUD scale, slot
# labels, hotkey text, panel positions - are each player's own and are deliberately absent.
#
# `Lock Configuration` is the key that makes the rest bind, and it carries a specific risk here.
# `[0 - Presets] Apply Preset` is *not* synchronised, and its `Full` branch assigns
# `VanityOption.Value = Toggle.On`. Unlocked, one click of that preset hands a player the vanity
# button back and the decision below is undone locally.
#
# Extra inventory rows stay at zero, against a range of 0 to 5. Carrying capacity stays vanilla
# plus whatever Haldor sells, which the mod adds independently. That also disposes of the one
# thing the swap cost: InventorySlots gated its extra rows behind discovering HardAntler, then
# CryptKey, then Wishbone, and AzuEPI has no progression system at all. With no extra rows there
# is nothing to gate, so the missing gate costs nothing (docs/rules.md).
#
# `Auto-Equip Items` is off. Its own description includes items "recovered from tombstones", so
# on a corpse run it would re-equip gear the moment it entered the inventory - which is a death
# rule, and death rules belong to PvPBiomeDominions alone (ADR-0004, #8).
#
# The two slot-shape lists are pinned empty and the armour switches to the values that keep
# vanilla balance, the same reasoning the CreatureManager and DataForge data files use: a package
# default that later ships content is caught at review instead of silently loaded.
#
# The vanity surface is off. There is no switch for the vanity *system* - `Show Vanity Button` is
# the only vanity key the mod has - and hiding the button is sufficient anyway. The evidence, and
# why the `Minimal` preset is not used instead, are in docs/modstack.md under Known interactions.

[1 - Server & Sync]
Lock Configuration = On

[2 - Inventory]
Extra Inventory Rows = 0
Enable Equipment Row = On
Display Equipment in Separate Panel = On
Auto-Equip Items = Off

[3 - Quick Slots]
Number of Quick Slots = 3
Show Quick Slots on HUD = On
Always Show All Slots = On

[4 - Special Equipment Slots]
Enable Wishbone Slot = On
Enable Demister Slot = On
One Utility Item At A Time = Off

[4.5 - Equipment Slot Management]
Removed Equipment Slots = 
Custom Equipment Slots = 
Slots Use Armor = On
Utility Slots Use Armor = Off

[5 - UI Features]
Show Vanity Button = Off
Show Loadout Button = On
