# Enforced server config for AzuExtendedPlayerInventory (#74), which replaced InventorySlots.
#
# The mod is here for one thing: armour out of the backpack. Everything below either serves that
# or refuses a feature the run did not ask for. Every key here is a synchronised setting, so the
# server decides it for everyone; the client-only keys the mod also has - HUD scale, slot labels,
# hotkey text - are each player's own and are deliberately absent.
#
# Extra inventory rows stay at zero. Carrying capacity stays vanilla plus whatever Haldor sells,
# which the mod adds independently of this setting. That also disposes of the one thing the swap
# cost us: InventorySlots gated its extra rows behind discovering HardAntler, then CryptKey, then
# Wishbone, and AzuEPI has no progression system at all - its rows are a flat 0 to 6. With no
# extra rows there is nothing to gate, so the missing gate costs nothing (docs/rules.md).
#
# Three quick slots, matching the row players already have. The equipment row is the feature
# itself, in its own panel. The Wishbone and Demister slots stop two items eating utility space,
# and `One Utility Item At A Time` stays off, because restoring vanilla exclusivity would undo
# exactly that.
#
# The vanity answer, established from the assembly rather than the readme (#74). There is no
# switch that disables the vanity *system*: `Show Vanity Button` is the only vanity key, and all
# it does is `VanityButtonGo.SetActive(...)`. Hiding the button is nonetheless sufficient, because
# that GameObject carries the gamepad binding too, so an inactive button leaves no way to open the
# panel and no way to author a vanity set. The system is present and unreachable, which is what
# this run wants. The `Minimal` preset would achieve the same thing and take loadouts and the
# stats panel with it, so it is not used - those two are kept deliberately.

[2 - Inventory]
Extra Inventory Rows = 0
Enable Equipment Row = On
Display Equipment in Separate Panel = On

[3 - Quick Slots]
Number of Quick Slots = 3
Show Quick Slots on HUD = On
Always Show All Slots = On

[4 - Special Equipment Slots]
Enable Wishbone Slot = On
Enable Demister Slot = On
One Utility Item At A Time = Off

[5 - UI Features]
Show Vanity Button = Off
Show Loadout Button = On
