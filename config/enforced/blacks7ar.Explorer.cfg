# Explorer 1.1.7 (2026-10-05, ADR-0019/0024): skill-gated live radar.
# Callings replaces each tracker's Detection Radius before Update with its server-locked
# RangeAtLevel1/RangeAt100 curve (20..64 m); 64 is the upstream creation value only.
# Max Pin is GLOBAL despite its description: 20 leaves room for mixed resources and
# dungeons without turning a dense forest into an unreadable map (upstream maximum 50).
# BetterMap alone owns m_exploreRadius = 100 before UpdateExplore; Explorer multiplies the Explore argument
# by 1 + (skill / 100) * 2, giving 100..300 m without two field writers.

[1- ServerSync]
Lock Configuration = On

[2- Exploration]
Detection Radius = 64
Radius Increase Per Level = 2
Max Pin = 20

[3- Skills Exp]
# Callings restores bundled skills and applies the WAP profession death drain once.
Exp Loss Amount = 0

[4- Resources]
# Zero disables a tier, so Meadows starts at 1 rather than 0.
Tier1 Meadows Level = 1
Tier2 BlackForest Level = 10
Tier3 Swamp Level = 20
Tier4 Mountain Level = 30
Tier5 Plains Level = 40
Tier6 Mistlands Level = 50
Tier7 Ashlands Level = 60

[5- Dungeons]
Dungeons Level = 10
