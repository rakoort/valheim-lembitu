# Enforced server config for AdventureBackpacks (2026-10-05, owner's decisions). The packs stay
# one-way (docs/modstack.md): they are registered items, so removing the mod deletes them and their
# contents. These keys are the pack rule's balance input, and they are registered through the mod's
# synced-config path (`ConfigSyncBase.SyncedConfig`), so the server holds them for everyone.
#
# `Weight Multiplier = 0.85`: contents weigh 85%, a light convenience rather than a second carry
# stat. `Carry Bonus` is an integer: halve stock 5/10/15/20/25/30 and round down to
# 2/5/7/10/12/15 (owner, 2026-10-05), Meadows through Mistlands, so
# backpacks help carrying but stay below what the Hauling profession grants (docs/rules.md). 2.4.0
# adds Ashlands and Deep North packs at stock 35 and 40 with a 0.5 multiplier; the same rule makes
# them 17 and 20 at 0.85 (2026-10-17). The
# mod's automation settings (craft from backpack, auto-store) are each player's own and stay
# unpinned, as does the two legacy capes' section, which the decision does not cover. So do 2.4.0's
# per-pack model style, container tabs and open-with-station settings, all local presentation.
#
# The sections are the mod's own English names (`Backpack: <item name>`, from the embedded
# English translation table in AdventureBackpacks.dll 2.4.0).

[Backpack: Satchel]
Carry Bonus = 2
Weight Multiplier = 0.85

[Backpack: Rugged Backpack]
Carry Bonus = 5
Weight Multiplier = 0.85

[Backpack: Bloodbag Wetpack]
Carry Bonus = 7
Weight Multiplier = 0.85

[Backpack: Arctic Sherpa Pack]
Carry Bonus = 10
Weight Multiplier = 0.85

[Backpack: Lox Hide Knappsack]
Carry Bonus = 12
Weight Multiplier = 0.85

[Backpack: Explorers Wisppack]
Carry Bonus = 15
Weight Multiplier = 0.85

[Backpack: Cinderward Pack]
Carry Bonus = 17
Weight Multiplier = 0.85

[Backpack: Frostbound Haversack]
Carry Bonus = 20
Weight Multiplier = 0.85

# Live's values (read 2026-10-27), kept for the Pool: the Workload copies this file whole, so a key
# left out returns to its default (docs/server-image.md, "The config"). Package defaults: quality
# level 1 for each, except the Demister's 2, and telemetry off.
[Effect: Cold Immunity]
Effective Quality Level: Ashlands = 0
Effective Quality Level: DeepNorth = 0

[Effect: Demister]
Effective Quality Level: Mistlands = 4

[Effect: Frost Resistance]
Effective Quality Level: Ashlands = 0
Effective Quality Level: DeepNorth = 0
Effective Quality Level: Plains = 3

# Telemetry is off (ra, 2026-10-27, on valheim-lembitu #133): live had it on; pinned off explicitly,
# the package default, so the overlay turns it off on live too when next applied.
[Local Config]
Enable Anonymous Telemetry = false
