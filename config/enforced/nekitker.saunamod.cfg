# Enforced server config for SaunaMod (2026-10-05), in its own Jotunn-synced ConfigFile
# (`nekitker.saunamod.cfg`, not the BepInPlugin GUID). Only the decided deviation is pinned; every
# other section (General, Comfort, Recipes, Gameplay, WellSteamed) stays at the package defaults.
#
# `DurationMultiplier = 1` returns the sauna bucket's resistance meads to vanilla duration
# (package default 1.2). The sauna's comfort already stacks with the Guilds Comfort upgrade, and
# the owner kept both (docs/modstack.md); lengthening the meads on top would make the sauna the
# best buff source in the pack rather than a comfort piece. The key is marked admin-only upstream
# (SaunaMod.dll 2.1.0, `SyncedConfigDescription`), and this overlay is what holds it for everyone.

[Mead]
DurationMultiplier = 1
