# Enforced server config for Lembitu.Oathbound (2026-10-05, ADR-0022, ADR-0025). Plugin defaults,
# pinned because the design depends on them.
#
#   Radius = 100            - a party member shares a kill only within 100 m of the dead creature,
#                             the radius of boss keys and ProgressivePowers' mastery credit.
#   FullPartyBonus = 0.5    - the party shares the kill's XP x (1 + 0.5 x (n - 1) / (size - 1)):
#                             100% for one member in range, 150% at FullPartySize.
#   FullPartySize = 4       - hunting parties are usually two to four, so the bonus is complete at
#                             four (2026-10-04 premium review): two members earn 58% of a kill each,
#                             three 44%, four 37.5%; larger parties split the same 150% total
#                             among all members (five 30%, eight 18.75%).
#   SpellGrowth = 0.04      - spell damage grows 4% per power level, Oathbound's own rate; the
#                             Shakedown lowers it only if casters fall outside the class band
#                             (ADR-0025).
#   DamageMultiplier = 0.75 - companions start the Shakedown at three quarters damage: the Hunter's
#                             wolf, the Dragonsworn whelp and the Warlock's skeletons, on top of the
#                             power-level cap (ADR-0025).

[Party]
Radius = 100
FullPartyBonus = 0.5
FullPartySize = 4

[Power]
SpellGrowth = 0.04

[Companions]
DamageMultiplier = 0.75
