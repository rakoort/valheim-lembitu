# Enforced server config for Lembitu.Oathbound (2026-10-11, ADR-0035, ADR-0025). Plugin defaults,
# pinned because the design depends on them.
#
#   Radius = 100            - connected, alive guild members share a kill within 100 m of the dead
#                             creature. The killer always counts, wherever they stand.
#   FullBonus = 0.5         - the guild shares XP x (1 + 0.5 x min(1, (n - 1) / (members - 1))).
#                             The total grows from 100% for one member to 150% at FullBonusMembers.
#   FullBonusMembers = 4    - the guild has at most five members; the bonus is complete at four in
#                             range: two members earn 58% of a kill each, three 44%, four 37.5%,
#                             five 30%.
#   DamageMultiplier = 0.75 - companions start the Shakedown at three quarters damage: the Hunter's
#                             wolf, the Dragonsworn whelp and the Warlock's skeletons, on top of the
#                             power-level cap (ADR-0025).

[Guild XP]
Radius = 100
FullBonus = 0.5
FullBonusMembers = 4

[Companions]
DamageMultiplier = 0.75

[BetterArchery Arrow Improvements]
# Stock arrow gameplay, with Ranger talents stacking above it (2026-10-06, owner).
Enable Arrow Improvements = true
# Stock projectile speed (2026-10-06, owner).
Set Arrow Velocity = 70
# Stock projectile gravity (2026-10-06, owner).
Set Arrow Gravity = 15
# Stock accuracy (2026-10-06, owner).
Set Arrow Accuracy = 0
# Stock aiming correction (2026-10-06, owner). Written as BepInEx serialises the float 0.05, so the
# enforced-config verifier compares equal text.
Set Aim Direction = {"x":0.0,"y":0.05000000074505806,"z":0.0}

[BetterArchery Other]
# Stock bow draw movement cost (2026-10-06, owner).
Enable Bow Draw Movement Speed Reduction = true
# Stock crouching behavior (2026-10-06, owner).
Enable Crouch Bow Draw = true
# Stock field arrow crafting (2026-10-06, owner).
Enable Crafting Wooden Arrow Everywhere = true

[BetterArchery Retrievable Arrows]
# Stock recovery gameplay (2026-10-06, owner).
Enable Retrievable Arrows = true
# Stock recovery lifetime (2026-10-06, owner).
Arrow Disappear Time = 60
# Stock non-retrievable impact behavior (2026-10-06, owner).
Arrow Disappear On Hit = false
# Stock collider behavior (2026-10-06, owner).
Retrievable Arrow Solid Collider = false
# Stock manual pickup (2026-10-06, owner).
Arrow Auto Pickup = false
# Stock ammunition recovery chances and replacement prefabs (2026-10-06, owner).
Arrow Retrieve List = ArrowWood=0.2;ArrowFlint=0.3;ArrowBronze=0.5;ArrowIron=0.7;ArrowObsidian=0.7;ArrowNeedle=0.1;ArrowFire=0;ArrowPoison=0.7>ArrowObsidian;ArrowSilver=0.5;ArrowFrost=0.7>ArrowObsidian;ArrowCarapace=0.7;ArrowCharred=0.7;BoltBone=0.3;BoltIron=0.5;BoltBlackmetal=0.7;BoltCarapace=0.7;BoltCharred=0.7
