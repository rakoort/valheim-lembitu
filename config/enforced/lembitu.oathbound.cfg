# Enforced server config for Lembitu.Oathbound (2026-10-04, ADR-0022). Plugin defaults, pinned
# because the design depends on them.
#
#   Radius = 100           - a party member shares a kill only within 100 m of the dead creature,
#                            the radius of boss keys and ProgressivePowers' mastery credit.
#   FullPartyBonus = 0.5   - the party shares the kill's XP x (1 + 0.5 x (n - 1) / 7): 100% for one
#                            member in range, 150% for eight.
#   FullPartySize = 8      - SocialSystem's party cap, where that bonus is complete.

[Party]
Radius = 100
FullPartyBonus = 0.5
FullPartySize = 8
