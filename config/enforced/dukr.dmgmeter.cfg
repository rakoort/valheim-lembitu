# Enforced server config for DamageMeter (2026-10-05). The mod has no ServerSync: the [Server]
# section is read by whichever installation collects the fights, and that is the server's, so this
# overlay is what pins it. The client-side panel, menu and keys are Pack seeds and each player's
# own; the client ignores the [Server] section.
#
# `SummaryDeathRecaps = true` - the after-kill table gains the death recaps (what hit whom before a
#   death), which is how a group learns from a wipe rather than from memory (package default off).
# `Awards = false` - the joke titles ("most deaths") under the table stay off: deaths are meant to
#   cost something, and the run does not rank them for laughs (ADR-0019).
# `ExpeditionStart = Admins` - an expedition (a long meter over a whole hunt) is started by an
#   admin, so the meter's scope stays a server decision rather than something any player can run
#   for everyone (package default "Anyone"; the value list is exactly "Anyone" or "Admins",
#   DamageMeter.dll 3.7.0).

[Server]
Awards = false
ExpeditionStart = Admins
SummaryDeathRecaps = true
