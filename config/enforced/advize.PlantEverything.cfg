# Enforced server config for PlantEverything (2026-10-04, ADR-0021). Planting outside a plant's own
# biome is a Farming specialist's reward: ImpactfulSkills lifts biome restrictions at high Farming
# level. PlantEverything would hand that freedom to everyone for its own plantables (berry bushes,
# mushrooms, saplings), so both biome rules are enforced. `EnforceBiomesVanilla` is the package
# default for vanilla crops; `EnforceBiomes` is not (the package lets its own plantables grow
# anywhere).

[Difficulty]
EnforceBiomes = true
EnforceBiomesVanilla = true
