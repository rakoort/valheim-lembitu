<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valheim Map</title>
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="map"></div>

  <div id="status" class="status">
    <span id="world-name">Connecting…</span>
    <span id="clock" class="clock"></span>
    <div id="render" class="render hidden">
      <span id="render-text">Rendering world map…</span>
      <div class="bar"><div id="render-bar"></div></div>
    </div>
  </div>

  <button id="panel-toggle" class="panel-toggle" type="button" aria-label="Players">
    <span aria-hidden="true">⚑</span>
  </button>

  <aside id="panel" class="panel">
    <header>
      <h1 class="panel-title">The fellowship</h1>
      <span id="explored" class="muted"></span>
    </header>
    <div class="panel-scroll">
    <section id="guild-card" class="guild-card hidden" aria-live="polite">
      <button id="guild-close" type="button" aria-label="Close guild card">Close</button>
      <div id="guild-details"></div>
    </section>
    <section>
      <ul id="players"></ul>
      <p id="no-players" class="muted">Nobody online.</p>
      <footer class="muted">Live positions follow this server's web-map policy, which may override in-game position privacy.</footer>
    </section>
    <section aria-labelledby="layers-title">
      <h2 id="layers-title" class="panel-title">Chart layers</h2>
      <div class="marker-filters">
        <label><input type="checkbox" id="f-territories" checked> Guild territories</label>
        <label><input type="checkbox" id="f-wards" checked> Wards</label>
        <label><input type="checkbox" id="f-regions" checked> Start regions</label>
        <label><input type="checkbox" id="f-outposts" checked> Outposts &amp; Sieges</label>
        <label><input type="checkbox" id="f-pins" checked> Cartography markers</label>
        <label id="f-checked-wrap"><input type="checkbox" id="f-checked" checked> Crossed out</label>
        <label id="f-traders-wrap"><input type="checkbox" id="f-traders" checked> Traders</label>
        <label id="f-deaths-wrap"><input type="checkbox" id="f-deaths" checked> Deaths</label>
      </div>
      <footer class="muted">Markers come from cartography tables in the world. Deaths come from the server's own records.</footer>
    </section>
    </div>
  </aside>

  <div id="coords" class="coords"></div>

  <script src="leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
